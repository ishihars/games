<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>もりの フルーツキャッチ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1b3a24;
  font-family:"Kiwi Maru","Zen Maru Gothic","Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Rounded Mplus 1c",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1024px;height:768px;position:relative;transform-origin:center center;
  background:linear-gradient(#bfe6f5 0%,#dff2e0 62%,#dff2e0 100%);overflow:hidden;border-radius:8px}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;
  border-radius:26px;border:5px solid rgba(0,0,0,.14);cursor:pointer;font-weight:700;
  color:#3b2b12;background:#ffd86b;box-shadow:0 6px 0 rgba(0,0,0,.16);transition:transform .08s}
.btn:active{transform:scale(.95)}
.btn.g{background:#8fd97a}.btn.b{background:#9fd4f5}.btn.w{background:#fff5e0}
.hidden{display:none!important}

/* --- title --- */
#s-title .logo{position:absolute;top:120px;left:0;width:1024px;text-align:center;
  font-size:82px;font-weight:700;color:#2f6b3a;text-shadow:0 5px 0 #fff}
#s-title .sub{position:absolute;top:236px;left:0;width:1024px;text-align:center;font-size:32px;color:#4a6b52}

/* --- hint panel --- */
#hint{position:absolute;left:28px;top:16px;width:344px;height:152px;background:#e7f7e4;
  border:5px solid #8ec78a;border-radius:20px}
#hint.blink{animation:hintblink 1s steps(1,end) infinite}
@keyframes hintblink{0%,50%{background:#e7f7e4}50.01%,100%{background:#fff6c9}}
#hintTitle{position:absolute;left:20px;top:6px;font-size:27px;color:#2f6b3a;font-weight:700}
#frame{position:absolute;left:20px;top:42px}
#extras{position:absolute;left:20px;top:120px;display:flex;gap:4px}
.cell{position:absolute;width:34px;height:34px;border-radius:50%}
.cell.empty{border:3px dashed #9bbd97;background:transparent}
.cell.fill{background:#f0704a;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.cell.lit{background:#ffd24a;box-shadow:0 0 0 4px #ffe9a3}
.cell.pulse{animation:cellpulse 1s ease-in-out infinite}
@keyframes cellpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
#frameBox{position:absolute;left:14px;top:36px;width:186px;height:78px;border-radius:12px;
  border:4px solid transparent;transition:border-color .2s}
#frameBox.gold{border-color:#f2b705;background:rgba(255,220,120,.35)}
.xdot{width:18px;height:18px;border-radius:50%;background:#f0704a}

/* --- question --- */
#qbox{position:absolute;right:32px;top:24px;left:400px;display:flex;align-items:center;justify-content:flex-end;gap:16px}
#qtext{font-size:72px;font-weight:700;color:#26402c;white-space:nowrap}
#qtext.mid{font-size:52px}#qtext.sm{font-size:40px}
#spk{width:80px;height:80px;border-radius:50%;background:#fff5e0;border:5px solid rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:38px}
#spk.on{animation:ripple .9s ease-out infinite}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(120,200,255,.8)}100%{box-shadow:0 0 0 22px rgba(120,200,255,0)}}

/* --- play field --- */
#ground{position:absolute;left:0;top:700px;width:1024px;height:68px;background:#7cc46a;
  border-top:6px solid #5da84c}
.fruit{position:absolute;width:120px;height:120px;border-radius:50%;background:#ff8b5e;
  border:6px solid #e2603a;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fruit .n{font-size:40px;font-weight:700;color:#5a1c07;line-height:1}
.fruit .mf{display:grid;grid-template-columns:repeat(5,9px);gap:2px;margin-top:5px}
.fruit .mc{width:9px;height:9px;border-radius:50%;background:#7a2a10}
.fruit .mc.o{background:transparent;border:1.5px solid rgba(122,42,16,.5)}
.fruit .mx{display:flex;gap:2px;margin-top:3px}
.fruit .mx i{display:block;width:7px;height:7px;border-radius:50%;background:#7a2a10}
.fruit.gone{animation:bounceout .55s ease-out forwards}
@keyframes bounceout{0%{transform:translateY(0) scale(1);opacity:1}
  35%{transform:translateY(-30px) scale(1.05)}100%{transform:translateY(0) scale(.7);opacity:0}}
#basket{position:absolute;top:620px;width:180px;height:110px;margin-left:-90px}
#basket .bk{position:absolute;left:0;top:34px;width:180px;height:76px;background:#d9a05b;
  border:6px solid #a9743a;border-radius:8px 8px 26px 26px}
#basket .rim{position:absolute;left:-6px;top:26px;width:192px;height:20px;background:#c98b45;
  border:5px solid #a9743a;border-radius:12px}
#basket.hit .bk{animation:bhit .4s ease-out}
@keyframes bhit{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
#chara{position:absolute;top:556px;width:110px;height:110px;margin-left:-55px}
#chara .body{position:absolute;left:12px;top:22px;width:86px;height:80px;background:#fff2cf;
  border:5px solid #b58a4a;border-radius:44px 44px 32px 32px}
#chara .ear{position:absolute;width:26px;height:44px;background:#fff2cf;border:5px solid #b58a4a;border-radius:14px}
#chara .e1{left:20px;top:-6px;transform:rotate(-14deg)}#chara .e2{left:66px;top:-6px;transform:rotate(14deg)}
#chara .eye{position:absolute;width:11px;height:13px;background:#4a3418;border-radius:50%;top:54px}
#chara .y1{left:38px}#chara .y2{left:64px}
#chara.jump{animation:cjump .62s ease-out}
@keyframes cjump{0%,100%{transform:translateY(0)}25%{transform:translateY(-38px)}50%{transform:translateY(0)}75%{transform:translateY(-20px)}}

/* --- feedback --- */
#fb{position:absolute;left:0;top:300px;width:1024px;text-align:center;font-size:56px;
  font-weight:700;color:#2f6b3a;text-shadow:0 4px 0 #fff;opacity:0;pointer-events:none}
#fb.show{animation:fbin 1.1s ease-out}
@keyframes fbin{0%{opacity:0;transform:scale(.7)}20%{opacity:1;transform:scale(1.08)}70%{opacity:1}100%{opacity:0}}
#maru{position:absolute;left:452px;top:250px;width:120px;height:120px;border-radius:50%;
  border:14px solid #f2544a;opacity:0}
#maru.show{animation:maruin .7s ease-out}
@keyframes maruin{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1)}}
.conf{position:absolute;width:14px;height:14px;border-radius:3px;pointer-events:none}

/* --- overlay explain --- */
#ov{position:absolute;inset:0;background:rgba(20,40,25,.55);display:none;z-index:20}
#ov.on{display:block}
#ovBox{position:absolute;left:212px;top:180px;width:600px;height:360px;background:#fffdf3;
  border:8px solid #8ec78a;border-radius:28px}
#ovFrame{position:absolute;left:60px;top:96px}
#ovBox .cell{width:52px;height:52px}
#ovExtras{position:absolute;left:60px;top:236px;display:flex;gap:8px}
#ovExtras .xdot{width:34px;height:34px}
#ovMsg{position:absolute;left:0;top:26px;width:600px;text-align:center;font-size:40px;
  font-weight:700;color:#2f6b3a}
#ovSkip{right:20px;bottom:16px;position:absolute;width:160px;height:60px;font-size:26px}
#ovFrameBox{position:absolute;left:48px;top:84px;width:308px;height:128px;border-radius:14px;
  border:6px solid transparent}
#ovFrameBox.gold{border-color:#f2b705;background:rgba(255,220,120,.4)}

/* --- rotate warning --- */
#rot{position:absolute;inset:0;background:#1b3a24;color:#fff;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:30px;z-index:99;font-size:40px}
#rot.on{display:flex}
#rot .ph{width:120px;height:190px;border:9px solid #fff;border-radius:16px;animation:rotp 2s ease-in-out infinite}
@keyframes rotp{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}

/* --- generic panels --- */
.big{position:absolute;left:0;width:1024px;text-align:center}
table.sum{border-collapse:collapse;width:100%;font-size:19px;font-family:sans-serif}
table.sum th,table.sum td{border:1px solid #cbd8c9;padding:7px 10px;text-align:left;vertical-align:top}
table.sum th{background:#eaf4e8;width:210px;color:#2f4a33}
#pbox{position:absolute;left:52px;top:70px;width:920px;height:620px;background:#fff;
  border-radius:18px;padding:22px 26px;overflow:auto;touch-action:pan-y}
.stamp{width:96px;height:96px;border-radius:50%;background:#fff5e0;border:6px solid #f2b705;
  display:inline-flex;align-items:center;justify-content:center;font-size:44px;margin:0 8px}


/* ============ visual refresh 2026-08-22 ============ */
:root{
  --sky1:#c9eeff;
  --sky2:#edf9e8;
  --forest:#5f9f5d;
  --forest-deep:#3f7746;
  --grass:#79c96b;
  --grass-dark:#56a34f;
  --cream:#fffaf0;
  --paper:#fffdf5;
  --wood:#b97a45;
  --wood-dark:#81502d;
  --ink:#294333;
  --muted:#5f7767;
  --yellow:#ffd86a;
  --yellow-deep:#e9ad3b;
  --blue:#9fd8f7;
  --blue-deep:#68b8e2;
  --green:#9be181;
  --green-deep:#62b457;
  --peach:#ff9b73;
  --peach-dark:#dd694b;
  --shadow:0 10px 24px rgba(55,91,63,.16);
}
html,body{
  background:linear-gradient(180deg,#173522 0%,#244c31 100%);
  color:var(--ink);
}
#stage{
  flex:0 0 1024px;
  min-width:1024px;
  min-height:768px;
  background:
    radial-gradient(circle at 16% 14%,rgba(255,255,255,.75) 0 2%,transparent 2.3%),
    radial-gradient(circle at 82% 11%,rgba(255,255,255,.7) 0 2.3%,transparent 2.6%),
    linear-gradient(180deg,var(--sky1) 0%,#dff5ee 48%,#dff1c9 66%,#c8e3a7 100%);
  border-radius:26px;
  box-shadow:0 24px 70px rgba(0,0,0,.34), inset 0 0 0 2px rgba(255,255,255,.35);
  isolation:isolate;
}
#stage:before,#stage:after{
  content:"";
  position:absolute;
  left:-40px;right:-40px;
  pointer-events:none;
  z-index:0;
}
#stage:before{
  bottom:108px;height:250px;
  background:
    radial-gradient(ellipse at 8% 100%,#7fb579 0 24%,transparent 25%),
    radial-gradient(ellipse at 28% 100%,#6da66d 0 28%,transparent 29%),
    radial-gradient(ellipse at 50% 100%,#77b275 0 27%,transparent 28%),
    radial-gradient(ellipse at 72% 100%,#679f67 0 28%,transparent 29%),
    radial-gradient(ellipse at 92% 100%,#79af72 0 25%,transparent 26%);
  opacity:.46;
}
#stage:after{
  bottom:58px;height:86px;
  background:
    radial-gradient(circle at 5% 30%,#fff8c0 0 5px,transparent 6px),
    radial-gradient(circle at 9% 55%,#ffcad5 0 5px,transparent 6px),
    radial-gradient(circle at 23% 36%,#fff8c0 0 4px,transparent 5px),
    radial-gradient(circle at 78% 40%,#ffcad5 0 5px,transparent 6px),
    radial-gradient(circle at 91% 30%,#fff8c0 0 5px,transparent 6px),
    linear-gradient(180deg,transparent 0 35%,rgba(38,118,52,.08) 36% 100%);
  opacity:.95;
}
.scr>*{z-index:2}

/* buttons */
.btn{
  border-radius:34px;
  border:3px solid rgba(92,74,37,.16);
  color:#3a351f;
  background:linear-gradient(180deg,#ffe79b 0%,var(--yellow) 72%,#f5c354 100%);
  box-shadow:0 9px 0 rgba(150,100,35,.24),0 15px 25px rgba(64,82,54,.12),inset 0 2px 0 rgba(255,255,255,.75);
  text-shadow:0 1px 0 rgba(255,255,255,.72);
  transition:transform .09s ease,box-shadow .09s ease,filter .15s ease;
}
.btn:active{
  transform:translateY(5px) scale(.98);
  box-shadow:0 4px 0 rgba(150,100,35,.22),0 8px 14px rgba(64,82,54,.10),inset 0 1px 0 rgba(255,255,255,.65);
}
.btn.g{background:linear-gradient(180deg,#c3f1a9 0%,var(--green) 72%,#7ccd69 100%);box-shadow:0 9px 0 rgba(58,132,61,.25),0 15px 25px rgba(64,82,54,.12),inset 0 2px 0 rgba(255,255,255,.75)}
.btn.b{background:linear-gradient(180deg,#c9ebfd 0%,var(--blue) 72%,#78c6eb 100%);box-shadow:0 9px 0 rgba(63,140,180,.22),0 15px 25px rgba(64,82,54,.12),inset 0 2px 0 rgba(255,255,255,.75)}
.btn.w{background:linear-gradient(180deg,#fffefa 0%,#fff6e6 100%);box-shadow:0 7px 0 rgba(104,91,62,.14),0 12px 22px rgba(64,82,54,.10),inset 0 2px 0 rgba(255,255,255,.9)}

/* title */
#s-title:before{
  content:"";position:absolute;left:92px;right:92px;top:82px;height:230px;
  border-radius:46px;
  background:linear-gradient(180deg,rgba(255,255,255,.77),rgba(255,253,240,.88));
  border:3px solid rgba(109,145,93,.18);
  box-shadow:var(--shadow),inset 0 2px 0 rgba(255,255,255,.9);
}
#s-title .logo{
  top:116px;
  font-size:74px;
  color:#2f7144;
  letter-spacing:2px;
  text-shadow:0 4px 0 #f7fff4,0 7px 0 rgba(69,113,72,.12);
}
#s-title .logo:before,#s-title .logo:after{position:absolute;top:18px;font-size:42px;line-height:1;text-shadow:none}
#s-title .logo:before{content:"🍎";left:48px}
#s-title .logo:after{content:"🍐";right:48px}
#s-title .sub{top:235px;font-size:28px;color:#567660;letter-spacing:1px}
#b-start{border-radius:46px!important;font-size:48px!important;letter-spacing:3px}
#b-start:before{content:"▶";font-size:30px;margin-right:18px;color:#4f8f4a;text-shadow:none}

/* course cards */
#s-course .big{
  top:86px!important;
  font-size:46px!important;
  color:#2f7144!important;
  text-shadow:0 3px 0 rgba(255,255,255,.75);
}
.crs{
  top:228px!important;
  height:232px!important;
  border-radius:34px!important;
  border:4px solid rgba(255,255,255,.55)!important;
  box-shadow:0 14px 28px rgba(52,91,60,.16),0 8px 0 rgba(58,130,64,.18)!important;
  overflow:hidden;
}
.crs:after{
  content:"";position:absolute;left:18px;right:18px;bottom:16px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.28);filter:blur(1px);
}
.crs>div{font-size:76px!important;line-height:.95;margin-bottom:10px;text-shadow:0 3px 0 rgba(255,255,255,.65)}

/* hint panel = study core */
#hint{
  left:26px;top:18px;width:350px;height:160px;
  background:linear-gradient(180deg,#fffdf2 0%,#f7f2dc 100%);
  border:5px solid #c28a56;
  border-radius:22px;
  box-shadow:0 10px 24px rgba(79,81,45,.14),inset 0 0 0 3px rgba(255,255,255,.5);
}
#hint:before,#hint:after{
  content:"";position:absolute;top:-10px;width:18px;height:180px;border-radius:12px;
  background:linear-gradient(90deg,#8f5d37,#c88b56,#8a5734);z-index:-1
}
#hint:before{left:18px;transform:rotate(-1.5deg)}
#hint:after{right:18px;transform:rotate(1.5deg)}
#hintTitle{left:24px;top:8px;font-size:27px;color:#3d6d45;letter-spacing:.5px}
#frameBox{border-radius:14px}
#frameBox.gold{border-color:#e5b43b;background:rgba(255,229,132,.46);box-shadow:0 0 0 3px rgba(255,245,187,.55)}
.cell.empty{border:3px dashed #a2b99c;background:rgba(255,255,255,.35)}
.cell.fill{background:linear-gradient(180deg,#ff9a74,#ee744f);box-shadow:inset 0 -3px 0 rgba(130,52,26,.12),0 2px 3px rgba(84,58,35,.12)}
.cell.lit{background:linear-gradient(180deg,#ffe97a,#ffc84d);box-shadow:0 0 0 4px #fff0ab,0 3px 7px rgba(170,122,30,.15)}

/* question */
#qbox{
  right:28px;top:26px;left:398px;
  background:rgba(255,255,255,.78);
  border:3px solid rgba(86,126,92,.14);
  border-radius:28px;
  padding:10px 14px 10px 24px;
  box-shadow:0 9px 22px rgba(64,101,73,.12),inset 0 2px 0 rgba(255,255,255,.85);
}
#qtext{font-size:66px;color:#2a4634;text-shadow:0 2px 0 #fff;letter-spacing:1px}
#qtext.mid{font-size:49px}#qtext.sm{font-size:38px}
#spk{
  width:72px;height:72px;font-size:34px;
  background:linear-gradient(180deg,#fffefa,#fff1d5);
  border:3px solid rgba(119,95,50,.14);
  box-shadow:0 5px 0 rgba(129,98,46,.12),0 8px 14px rgba(75,90,55,.08);
}
#stepTag{color:#5f7767!important;font-weight:700;background:rgba(255,255,255,.45);padding:4px 10px;border-radius:12px}

/* fruit */
.fruit{
  width:120px;height:120px;
  border-radius:46% 46% 48% 48% / 44% 44% 55% 55%;
  background:radial-gradient(circle at 35% 24%,#ffc2aa 0 9%,transparent 10%),linear-gradient(180deg,#ff9e77 0%,#f47c58 60%,#e96847 100%);
  border:5px solid #d65e40;
  box-shadow:inset 0 -10px 0 rgba(167,61,31,.08),0 10px 18px rgba(67,79,43,.16);
  overflow:visible;
}
.fruit:before{
  content:"";position:absolute;width:14px;height:24px;left:54px;top:-18px;border-radius:10px;
  background:linear-gradient(90deg,#704427,#9b6842,#704427);transform:rotate(5deg)
}
.fruit:after{
  content:"";position:absolute;width:34px;height:20px;left:65px;top:-14px;border-radius:75% 15% 75% 15%;
  background:linear-gradient(135deg,#90cc67,#55a64f);border:2px solid rgba(57,117,56,.35);transform:rotate(18deg)
}
.fruit .n{font-size:41px;color:#6d2415;text-shadow:0 2px 0 rgba(255,255,255,.34)}
.fruit .mf{background:rgba(255,248,234,.44);padding:4px 5px;border-radius:9px;gap:2px;margin-top:4px}
.fruit .mc{background:#7d2e1d;box-shadow:0 1px 0 rgba(255,255,255,.18)}
.fruit .mc.o{background:rgba(255,255,255,.26);border:1.5px solid rgba(105,45,29,.38)}
.fruit .mx i{background:#7d2e1d}

/* ground */
#ground{
  top:700px;height:68px;
  background:linear-gradient(180deg,#83d06f 0%,#68bd5b 55%,#5ca950 100%);
  border-top:6px solid #4f9b46;
  box-shadow:inset 0 8px 0 rgba(255,255,255,.12);
}
#ground:before{
  content:"";position:absolute;left:0;right:0;top:-15px;height:20px;
  background:radial-gradient(ellipse at 10px 18px,#5aa64f 0 12px,transparent 13px) 0 0/38px 22px repeat-x;
}

/* basket */
#basket{filter:drop-shadow(0 8px 8px rgba(56,70,35,.18))}
#basket .bk{
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 9px,rgba(115,67,31,.06) 9px 18px),
    linear-gradient(180deg,#dca260 0%,#c9894f 100%);
  border:6px solid #8b5b32;
  border-radius:10px 10px 30px 30px;
  box-shadow:inset 0 8px 0 rgba(255,255,255,.12),inset 0 -8px 0 rgba(90,54,28,.08);
}
#basket .bk:before{
  content:"";position:absolute;left:14px;right:14px;top:13px;bottom:12px;border-radius:18px;
  background:repeating-linear-gradient(0deg,transparent 0 16px,rgba(103,59,29,.13) 16px 19px)
}
#basket .rim{
  background:linear-gradient(180deg,#d79a58,#b9763f);
  border:5px solid #84542f;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.16)
}

/* character */
#chara{filter:drop-shadow(0 7px 7px rgba(63,80,42,.14))}
#chara .body{
  background:linear-gradient(180deg,#fff9df 0%,#f4e5b9 100%);
  border:5px solid #a87d43;
  border-radius:47px 47px 35px 35px;
  box-shadow:inset 0 5px 0 rgba(255,255,255,.55);
}
#chara .body:before{
  content:"";position:absolute;width:12px;height:9px;left:32px;top:41px;border-radius:50%;background:#9b6d45
}
#chara .body:after{
  content:"";position:absolute;left:11px;top:45px;width:56px;height:20px;
  background:radial-gradient(circle at 6px 8px,#efb0a5 0 5px,transparent 6px),radial-gradient(circle at 50px 8px,#efb0a5 0 5px,transparent 6px)
}
#chara .ear{background:linear-gradient(180deg,#fff9df,#f0dfaf);border:5px solid #a87d43}
#chara .ear:after{content:"";position:absolute;left:5px;top:8px;width:8px;height:20px;border-radius:8px;background:#e8c69f;opacity:.65}
#chara .eye{width:12px;height:14px;background:#4f3a22;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}

/* feedback */
#fb{top:294px;font-size:54px;color:#2f7a43;text-shadow:0 4px 0 #fff,0 7px 12px rgba(49,94,53,.12)}
#maru{border-color:#ef5e55;filter:drop-shadow(0 5px 8px rgba(183,61,52,.12))}

/* overlay */
#ov{background:rgba(31,56,37,.48);backdrop-filter:blur(2px)}
#ovBox{
  background:linear-gradient(180deg,#fffef8,#fff8e8);
  border:7px solid #b98655;
  box-shadow:0 22px 48px rgba(24,47,31,.28),inset 0 0 0 3px rgba(255,255,255,.62)
}
#ovMsg{color:#356e43}

<script>
"use strict";
/* ============ util ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ============ scale ============ */
function fit(){
  const w=innerWidth,h=innerHeight;
  $('#stage').style.transform='scale('+Math.min(w/1024,h/768)+')';
  $('#rot').classList.toggle('on', h>w*1.05 && w<900);
}
addEventListener('resize',fit);

/* ============ audio ============ */
let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} 
  if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,dur,type,vol,delay){
  const c=ac(); if(!c)return;
  const t=c.currentTime+(delay||0);
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.25,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
function slide(f1,f2,dur,vol){
  const c=ac(); if(!c)return; const t=c.currentTime;
  const o=c.createOscillator(),g=c.createGain(); o.type='triangle';
  o.frequency.setValueAtTime(f1,t); o.frequency.linearRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol||.3,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const SFX={
  tap:()=>tone(880,.06,'square',.18),
  move:()=>tone(220,.08,'triangle',.10),
  pop:()=>tone(660,.05,'sine',.16),
  good:()=>{[523.25,659.25,783.99].forEach((f,i)=>tone(f,.30,'sine',.26,i*.08));},
  ten:()=>{tone(783.99,.25,'sine',.28);tone(1046.5,.35,'sine',.28,.12);tone(1568,.5,'sine',.14,.24);},
  bad:()=>slide(392,330,.25,.28),
  miss:()=>tone(165,.15,'sine',.16),
  fanfare:()=>{[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,.5,'sine',.24,i*.16));}
};
/* BGM */
let bgmTimer=null,bpm=100;
function bgmStart(){ bgmStop(); if(RM)return;
  const chords=[[261.6,329.6,392],[293.7,349.2,440],[329.6,392,493.9],[261.6,329.6,392]];
  let i=0;
  const step=()=>{ const ch=chords[i%chords.length]; i++;
    ch.forEach(f=>tone(f/2,1.4,'sine',.045));
    bgmTimer=setTimeout(step, 60000/bpm*4);
  }; step();
}
function bgmStop(){ if(bgmTimer)clearTimeout(bgmTimer); bgmTimer=null; }
function bgmTempo(sp){ bpm=Math.round(100+(6.0-sp)*(sp<6?10:6)); bpm=Math.max(85,Math.min(120,bpm)); }

/* ============ speech ============ */
let speaking=false;
function say(t,cb){
  $('#spk').classList.add('on'); speaking=true;
  const done=()=>{ speaking=false; $('#spk').classList.remove('on'); cb&&cb(); };
  try{
    if(!window.speechSynthesis){ setTimeout(done,Math.min(2500,t.length*110)); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='ja-JP'; u.rate=.9; u.pitch=1.1;
    let fired=false;
    u.onend=()=>{ if(!fired){fired=true;done();} };
    u.onerror=()=>{ if(!fired){fired=true;done();} };
    speechSynthesis.speak(u);
    setTimeout(()=>{ if(!fired){fired=true;done();} }, Math.min(4000,900+t.length*140));
  }catch(e){ setTimeout(done,300); }
}

/* ============ problem generation ============ */
function addProblem(a,b){
  const c=a+b;
  let wA=c-1, kA='decomp';
  if(wA===10){ wA=c+2; }
  let wB=c+1, kB='count';
  if(wB>18){ wB=c-2; }
  if(wA===wB) wA=c+2;
  const opts=[{v:c,k:'correct'},{v:wA,k:kA},{v:wB,k:kB}];
  return {type:'add',a,b,ans:c,opts:opts.sort((x,y)=>x.v-y.v),
    expr:a+' ＋ '+b+' ＝ ?', say:a+' たす '+b+' は?'};
}
function subProblem(m,s){
  const d=m-s, ones=m-10;
  let wA=Math.abs(ones-s), kA='reverse';
  if(wA===d||wA<1||wA>18){ wA=d+2; kA='count'; }
  let wB=d+1, kB='count';
  if(wB>9) wB=d-1;
  if(wB===wA||wB<1) wB=(d+3<=9)?d+3:d-2;
  const opts=[{v:d,k:'correct'},{v:wA,k:kA},{v:wB,k:kB}];
  return {type:'sub',a:m,b:s,ans:d,opts:opts.sort((x,y)=>x.v-y.v),
    expr:m+' − '+s+' ＝ ?', say:m+' ひく '+s+' は?'};
}
function addStep(a){ // a = 被加数 fixed, choose b
  const bs=[]; for(let b=2;b<=9;b++){ const c=a+b; if(c>=11&&c<=18) bs.push(b); }
  return bs;
}
function subStep(s){ // s = 減数 fixed, choose m
  const ms=[]; for(let m=11;m<=18;m++){ const d=m-s; if(d>=1&&d<=9&&(m-10)<s) ms.push(m); }
  return ms;
}
function twoOf(arr){ const a=shuffle(arr.slice()); return [a[0],a[1]!==undefined?a[1]:a[0]]; }

function buildAdd(){
  const P=[]; P.push(Object.assign(addProblem(7,3),{step:'導入',demo:true}));
  twoOf(addStep(9)).forEach(b=>P.push(Object.assign(addProblem(9,b),{step:'S1'})));
  twoOf(addStep(8)).forEach(b=>P.push(Object.assign(addProblem(8,b),{step:'S2'})));
  twoOf(addStep(7)).forEach(b=>P.push(Object.assign(addProblem(7,b),{step:'S3'})));
  P.push(Object.assign(addProblem(6,pick(addStep(6))),{step:'S4'}));
  P.push(Object.assign(addProblem(5,pick(addStep(5))),{step:'S4'}));
  const base=pick([9,8]); P.push(Object.assign(addProblem(base,pick(addStep(base))),{step:'定着'}));
  return P;
}
function buildSub(){
  const P=[]; P.push(Object.assign(subProblem(10,4),{step:'導入',demo:true}));
  twoOf(subStep(9)).forEach(m=>P.push(Object.assign(subProblem(m,9),{step:'S1'})));
  twoOf(subStep(8)).forEach(m=>P.push(Object.assign(subProblem(m,8),{step:'S2'})));
  twoOf(subStep(7)).forEach(m=>P.push(Object.assign(subProblem(m,7),{step:'S3'})));
  P.push(Object.assign(subProblem(pick(subStep(6)),6),{step:'S4'}));
  P.push(Object.assign(subProblem(pick(subStep(5)),5),{step:'S4'}));
  P.push(Object.assign(subProblem(pick(subStep(9)),9),{step:'定着'}));
  return P;
}
function buildMix(){
  const A=buildAdd(), B=buildSub();
  const P=[Object.assign(addProblem(7,3),{step:'導入',demo:true})];
  const a=A.slice(1,6), b=B.slice(1,6);
  for(let i=0;i<5;i++){ P.push(a[i]); P.push(b[i]); }
  return P.slice(0,10);
}

/* ============ state ============ */
const LANE=[171,512,853], JUDGE=620, FRUIT=120, START=196;
const G={ course:'add', probs:[], idx:0, cur:null, speed:6.0, streak:0,
  attempts:0, tries:0, phase:'idle', basket:512, fruits:[], caught:false,
  wrongCount:0, cherry:null, kindTally:{}, log:[], stamps:[], sessions:0,
  collected:0, retryQ:[], served:0, firstTryOK:0, demo:false, cherryUses:0,
  miniUsed:false, skipCount:0, startAt:0, lastMoveDir:0 };

/* ============ hint panel ============ */
function frameCells(host,n,total,cell,gap,litFrom){
  host.innerHTML='';
  for(let i=0;i<10;i++){
    const d=document.createElement('div');
    d.className='cell '+(i<n?(litFrom!==undefined&&i>=litFrom?'lit':'fill'):'empty');
    d.dataset.i=i;
    d.style.left=(i%5)*(cell+gap)+'px'; d.style.top=Math.floor(i/5)*(cell+gap)+'px';
    d.style.width=cell+'px'; d.style.height=cell+'px';
    host.appendChild(d);
  }
}
function renderHint(p){
  const t=$('#hintTitle'), fb=$('#frameBox');
  fb.classList.remove('gold'); $('#hint').classList.remove('blink');
  if(p.type==='add'){
    t.textContent='いま '+p.a+'こ';
    frameCells($('#frame'),p.a,10,30,6);
    $('#extras').innerHTML='';
  }else{
    t.textContent='いま '+p.a+'こ';
    frameCells($('#frame'),10,10,30,6);
    fb.classList.add('gold');
    const ex=$('#extras'); ex.innerHTML='';
    for(let i=0;i<p.a-10;i++){ const d=document.createElement('div'); d.className='xdot'; ex.appendChild(d); }
  }
}
function litCountUp(host,cb){ // 1個ずつ点灯（ヒント2:数え間違い）
  const cells=[...host.querySelectorAll('.cell.fill')];
  cells.forEach((c,i)=>setTimeout(()=>{ c.classList.add('lit'); SFX.pop();
    setTimeout(()=>c.classList.remove('lit'),400); },i*500));
  setTimeout(()=>cb&&cb(),cells.length*500+400);
}
function pulseEmpty(){ $$('#frame .cell.empty').forEach(c=>c.classList.add('pulse'));
  setTimeout(()=>$$('#frame .cell').forEach(c=>c.classList.remove('pulse')),3000); }

/* ============ fruits ============ */
function dotsHTML(n){
  // 数字だけを読ませないための具体物表示: ミニ10フレーム＋あまり
  let h='<div class="mf">';
  for(let i=0;i<10;i++) h+='<div class="mc'+(i<n?'':' o')+'"></div>';
  h+='</div>';
  if(n>10){ h+='<div class="mx">'; for(let i=0;i<n-10;i++) h+='<i></i>'; h+='</div>'; }
  return h;
}
let laneHist=[];
function spawn(opts){
  const host=$('#fruits'); host.innerHTML=''; G.fruits=[];
  let order=shuffle(opts.slice()), guard=0;
  // 正解レーンが3回連続で同じにならないようにする
  while(guard++<20){
    const ci=order.findIndex(o=>o.k==='correct');
    if(!(laneHist.length>=2&&laneHist[0]===laneHist[1]&&laneHist[0]===ci))break;
    order=shuffle(opts.slice());
  }
  laneHist.unshift(order.findIndex(o=>o.k==='correct')); laneHist=laneHist.slice(0,2);
  order.forEach((o,i)=>{
    const e=document.createElement('div'); e.className='fruit';
    e.style.left=(LANE[i]-FRUIT/2)+'px'; e.style.top=START+'px';
    e.innerHTML='<div class="n">'+o.v+'</div>'+dotsHTML(o.v);
    host.appendChild(e);
    G.fruits.push({el:e,y:START,lane:i,x:LANE[i],opt:o,dead:false});
    setTimeout(()=>SFX.pop(),i*90);
  });
}

/* ============ basket ============ */
function setBasket(x){
  G.basket=Math.max(90,Math.min(934,x));
  $('#basket').style.left=G.basket+'px';
  $('#chara').style.left=G.basket+'px';
}
let dragging=false,dragStart=0,moved=false;
function stageX(ev){
  const r=$('#stage').getBoundingClientRect();
  const sc=r.width/1024;
  return (ev.clientX-r.left)/sc;
}
$('#stage').addEventListener('pointerdown',e=>{
  ac(); if(!$('#s-play').classList.contains('on')||G.demo)return;
  if(e.target.closest('.btn')||e.target.closest('#spk'))return;
  dragging=true; moved=false; dragStart=stageX(e);
});
addEventListener('pointermove',e=>{
  if(!dragging)return; const x=stageX(e);
  if(Math.abs(x-dragStart)>10){ if(!moved){moved=true;SFX.move();} setBasket(x); }
});
addEventListener('pointerup',e=>{
  if(!dragging)return; dragging=false;
  if(!moved){ const x=stageX(e); const dir=x<512?-1:1; nudge(dir); }
});
function nudge(dir){
  SFX.move();
  const cur=LANE.reduce((b,l,i)=>Math.abs(l-G.basket)<Math.abs(LANE[b]-G.basket)?i:b,0);
  const nx=Math.max(0,Math.min(2,cur+dir));
  animBasket(LANE[nx]);
}
function animBasket(target){
  const from=G.basket,t0=performance.now(),dur=250;
  const step=t=>{ const k=Math.min(1,(t-t0)/dur);
    setBasket(from+(target-from)*(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2));
    if(k<1)requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
addEventListener('keydown',e=>{
  if(!$('#s-play').classList.contains('on'))return;
  if(e.key==='ArrowLeft'){e.preventDefault();nudge(-1);}
  if(e.key==='ArrowRight'){e.preventDefault();nudge(1);}
  if(e.key===' '){e.preventDefault();G.cur&&say(G.cur.say);}
});

/* ============ main loop ============ */
let raf=null,lastT=0;
function loop(t){
  raf=requestAnimationFrame(loop);
  const dt=Math.min(.05,(t-lastT)/1000); lastT=t;
  if(G.phase!=='falling')return;
  if(G.demo){ // おてほん: カゴが正解レーンへ確実に追従する
    const c=G.fruits.find(f=>f.opt.k==='correct'&&!f.dead);
    if(c){ const d=c.x-G.basket; setBasket(G.basket+Math.sign(d)*Math.min(Math.abs(d),1400*dt)); }
  }
  const v=(JUDGE-START)/G.speed;
  let alive=0;
  for(const f of G.fruits){
    if(f.dead)continue;
    const prev=f.y; f.y+=v*dt; f.el.style.top=f.y+'px';
    if(prev<JUDGE&&f.y>=JUDGE){
      if(Math.abs(f.x-G.basket)<=90){ resolveCatch(f); return; }
    }
    if(f.y>700-FRUIT/2){ f.dead=true; f.el.classList.add('gone'); SFX.miss(); }
    else alive++;
  }
  if(alive===0&&G.phase==='falling'){ G.phase='resolving'; setTimeout(onMiss,500); }
}
requestAnimationFrame(t=>{lastT=t;loop(t);});

/* ============ round flow ============ */
function startSession(course){
  G.course=course; G.idx=0; G.speed=6.0; G.streak=0; G.log=[]; G.kindTally={};
  G.collected=0; G.retryQ=[]; G.served=0; G.firstTryOK=0; G.cherryUses=0;
  G.miniUsed=false; G.skipCount=0; G.startAt=Date.now(); G.ended=false;
  G.probs = course==='add'?buildAdd():course==='sub'?buildSub():buildMix();
  show('s-play'); bgmTempo(G.speed); bgmStart(); nextProblem();
}
function show(id){ $$('.scr').forEach(s=>s.classList.remove('on')); $('#'+id).classList.add('on'); }

function nextProblem(){
  // 再出題キュー（3問後）
  const due=G.retryQ.find(q=>q.at<=G.served);
  let p;
  if(due){ G.retryQ.splice(G.retryQ.indexOf(due),1); p=due.p; p.isRetry=true; }
  else if(G.idx<G.probs.length){ p=G.probs[G.idx++]; p.isRetry=false; }
  else if(G.retryQ.length&&G.served<14){ p=G.retryQ.shift().p; p.isRetry=true; }
  else return endSession();
  if(G.served>=14) return endSession();
  G.served++;
  G.cur=p; G.tries=0; G.wrongCount=0; G.cherry=null; G.caught=false;
  G.demo=!!p.demo&&G.served===1;
  presentProblem();
}
function setQ(t){ const e=$('#qtext'); e.textContent=t;
  e.className = t.length>14?'sm' : t.length>10?'mid' : ''; }
function presentProblem(){
  const p=G.cur;
  setQ(p.expr);
  $('#stepTag').textContent=(G.demo?'':'もんだい '+G.served+' / 10')+(p.isRetry?'（もういちど）':'');
  renderHint(p);
  $('#demoTag').classList.toggle('hidden',!G.demo);
  $('#b-skipdemo').classList.toggle('hidden',!G.demo);
  setBasket(512);
  spawn(p.opts);
  G.phase='think';
  say(p.say,()=>{
    setTimeout(()=>{
      if(G.phase!=='think')return;
      G.phase='falling';
      if(G.demo) runDemo();
    }, G._nothink?150:(RM?600:3000));
  });
}
function runDemo(){
  const idx=G.fruits.findIndex(f=>f.opt.k==='correct');
  setTimeout(()=>animBasket(LANE[G.fruits[idx].lane]),600);
}
$('#b-skipdemo').onclick=()=>{ SFX.tap(); G.demo=false; $('#demoTag').classList.add('hidden');
  $('#b-skipdemo').classList.add('hidden'); };

function resolveCatch(f){
  G.phase='resolving'; f.dead=true;
  $('#basket').classList.add('hit'); setTimeout(()=>$('#basket').classList.remove('hit'),400);
  if(G.cherry) return cherryResolve(f);
  if(f.opt.k==='correct') onCorrect();
  else onWrong(f);
}
function onCorrect(){
  SFX.good(); confetti(); $('#chara').classList.add('jump');
  $('#maru').classList.add('show'); flash('せいかい!');
  setTimeout(()=>{$('#chara').classList.remove('jump');$('#maru').classList.remove('show');},900);
  G.collected++;
  if(G.tries===0&&!G.demo){ G.firstTryOK++; G.streak++;
    if(G.streak>=3){ G.streak=0; setSpeed(G.speed-0.5); } }
  logAttempt('correct');
  setTimeout(clearFruits,600);
  setTimeout(()=>explain(G.cur,()=>{ clearFruits(); setTimeout(nextProblem,300); }),700);
}
function onWrong(f){
  SFX.bad(); flash('おしい!'); G.tries++; G.wrongCount++; G.streak=0;
  setSpeed(G.speed+1.0);
  const kind=f.opt.k; G.kindTally[kind]=(G.kindTally[kind]||0)+1;
  logAttempt(kind,f.opt.v);
  clearFruits();
  if(G.tries===1){ hint1(kind,()=>replay()); }
  else if(G.tries===2){ hint2(kind,()=>startCherry()); }
  else { cherryFallback(); }
  scheduleRetry();
  if((G.kindTally[kind]||0)>=3 && !G.miniUsed){ G.pendingMini=true; }
}
function onMiss(){
  G.tries++; G.streak=0; setSpeed(G.speed+1.0);
  logAttempt('miss'); clearFruits();
  say('だいじょうぶ。もういちど いくよ',()=>replay());
}
function replay(){
  if(G.pendingMini){ G.pendingMini=false; return startMini(); }
  spawn(G.cur.opts); setBasket(512); G.phase='think';
  setTimeout(()=>{ if(G.phase==='think')G.phase='falling'; },RM?400:1500);
}
function scheduleRetry(){
  if(G.retryQ.some(q=>q.p===G.cur))return;
  G.retryQ.push({p:G.cur,at:G.served+3});
}
function setSpeed(s){ G.speed=Math.max(4.0,Math.min(9.0,s)); bgmTempo(G.speed); }
function clearFruits(){ $('#fruits').innerHTML=''; G.fruits=[]; }

/* ---- hints ---- */
const HINT1={
  decomp:'10の へやを みてごらん。あと なんこで 10かな?',
  count:'もういちど ゆっくり かぞえてみよう',
  reverse:(p)=>(p.a-10)+'から '+p.b+'は ひけるかな?',
  addend:'たすのは いくつだったかな?'
};
function hint1(kind,cb){
  let t=HINT1[kind]||HINT1.count; if(typeof t==='function')t=t(G.cur);
  setTimeout(()=>say(t,cb),700);
}
function hint2(kind,cb){
  if(kind==='decomp'){ say('10の へやを みてごらん',()=>{ pulseEmpty(); setTimeout(cb,2200); }); }
  else if(kind==='reverse'){ say('10の へやから とろう',()=>{ $('#frameBox').classList.add('gold');
    $$('#extras .xdot').forEach(d=>d.style.transform='scale(1.2)');
    setTimeout(cb,1800); }); }
  else { say('ゆっくり かぞえるよ',()=>litCountUp($('#frame'),cb)); }
}

/* ---- cherry catch (2段階) ---- */
function startCherry(){
  G.cherryUses++; G.log.push({t:'cherry',expr:G.cur.expr});
  G.speed=9.0; bgmTempo(G.speed);
  const p=G.cur;
  if(p.type==='add'){
    const need=10-p.a, rest=p.b-need;
    G.cherry={stage:1,need,rest};
    $('#hint').classList.add('blink');
    say('10の へやを いっぱいに しよう',()=>{ pulseEmpty(); spawnCherry(need); });
  }else{
    const ones=p.a-10, fromTen=p.b-ones;
    G.cherry={stage:1,need:ones,rest:fromTen};
    $('#hint').classList.add('blink');
    say('まず そとの '+ones+'こから とろう',()=>spawnCherry(ones));
  }
}
function spawnCherry(correct){
  const set=new Set([correct]);
  let d=1; while(set.size<3){ if(correct-d>=1)set.add(correct-d); if(set.size<3)set.add(correct+d); d++; }
  const opts=[...set].sort((a,b)=>a-b).map(v=>({v,k:v===correct?'correct':'count'}));
  spawn(opts); setBasket(512); G.phase='falling';
}
function cherryResolve(f){
  const c=G.cherry, p=G.cur;
  if(f.opt.k!=='correct'){ SFX.bad(); flash('おしい!'); clearFruits();
    setTimeout(()=>{ if(c.stage===1)spawnCherry(c.need); else spawnCherry(c.rest); },900); return; }
  SFX.ten(); clearFruits();
  if(c.stage===1){
    if(p.type==='add'){
      frameCells($('#frame'),10,10,34,6,p.a); $('#frameBox').classList.add('gold');
      flash('10が できた!');
      say('10が できたね。のこりは いくつ?',()=>{ c.stage=2; spawnCherry(c.rest); });
    }else{
      $('#extras').innerHTML=''; flash('とれた!');
      say('つぎは 10の へやから '+c.rest+'こ とるよ',()=>{ c.stage=2; spawnCherry(c.rest); });
    }
  }else{
    if(p.type==='add'){ const ex=$('#extras'); ex.innerHTML='';
      for(let i=0;i<c.rest;i++){const d=document.createElement('div');d.className='xdot';ex.appendChild(d);} }
    else { frameCells($('#frame'),10-c.rest,10,30,6); }
    $('#hint').classList.remove('blink');
    SFX.good(); confetti(); flash('できたね!');
    logAttempt('cherry-ok');
    say(p.type==='add'?('10と '+c.rest+'で '+p.ans):('のこりは '+p.ans),()=>{
      G.cherry=null; setTimeout(nextProblem,400); });
  }
}
function cherryFallback(){ startCherry(); }

/* ---- mini stage ---- */
function startMini(){
  G.miniUsed=true; G.log.push({t:'mini'});
  G.speed=9.0; bgmTempo(G.speed);
  G.mini={left:3};
  say('ちょっと れんしゅうしよう',()=>miniProblem());
}
function miniProblem(){
  const a=2+rnd(8), need=10-a;
  G.cur={type:'add',a,b:need,ans:10,mini:true,expr:a+' と いくつで 10?',
    say:a+' と いくつで 10?',opts:[]};
  setQ(G.cur.expr); $('#stepTag').textContent='10の あわせっこ';
  renderHint(G.cur); pulseEmpty();
  const set=new Set([need]); let d=1;
  while(set.size<3){ if(need-d>=1)set.add(need-d); if(set.size<3)set.add(need+d); d++; }
  const opts=[...set].sort((x,y)=>x-y).map(v=>({v,k:v===need?'correct':'count'}));
  G.cur.opts=opts;
  say(G.cur.say,()=>{ spawn(opts); setBasket(512); G.phase='falling'; G.miniActive=true; });
}
function miniResolve(f){
  if(f.opt.k==='correct'){ SFX.ten(); confetti(); flash('できた!');
    frameCells($('#frame'),10,10,30,6); $('#frameBox').classList.add('gold');
    G.mini.left--; clearFruits();
    setTimeout(()=>{ if(G.mini.left>0)miniProblem();
      else { G.miniActive=false; say('もどるよ',()=>{ G.speed=9.0; nextProblem(); }); } },1400);
  }else{ SFX.bad(); flash('おしい!'); clearFruits();
    setTimeout(()=>{ spawn(G.cur.opts); setBasket(512); G.phase='falling'; },900); }
}

/* ---- explain overlay ---- */
function explain(p,cb){
  if(p.mini||G.demo===false&&false){}
  if(G.skipCount>=3) return quickExplain(p,cb);
  const ov=$('#ov'); ov.classList.add('on');
  let skipped=false;
  const fin=()=>{ if(skipped)return; skipped=true; ov.classList.remove('on'); cb&&cb(); };
  $('#ovSkip').onclick=()=>{ SFX.tap(); G.skipCount++; fin(); };
  const box=$('#ovFrameBox'), msg=$('#ovMsg'), ex=$('#ovExtras');
  box.classList.remove('gold'); ex.innerHTML='';
  const T=[];
  if(p.type==='add'){
    const need=10-p.a, rest=p.b-need;
    frameCells($('#ovFrame'),p.a,10,52,10); msg.textContent='';
    T.push([100,()=>{ msg.textContent=p.a+' に '+need+' を たして 10'; }]);
    T.push([500,()=>{ frameCells($('#ovFrame'),10,10,52,10,p.a); box.classList.add('gold'); SFX.ten(); }]);
    T.push([1300,()=>{ msg.textContent='のこりの '+rest+' で';
      for(let i=0;i<rest;i++){const d=document.createElement('div');d.className='xdot';ex.appendChild(d);SFX.pop();} }]);
    T.push([2000,()=>{ msg.textContent='10と '+rest+'で '+p.ans; }]);
    T.push([2600,fin]);
  }else{
    const ones=p.a-10, fromTen=p.b-ones;
    frameCells($('#ovFrame'),10,10,52,10); box.classList.add('gold');
    for(let i=0;i<ones;i++){const d=document.createElement('div');d.className='xdot';ex.appendChild(d);}
    msg.textContent='';
    T.push([100,()=>{ msg.textContent='そとの '+ones+' を とって'; }]);
    T.push([700,()=>{ ex.innerHTML=''; SFX.pop(); }]);
    T.push([1300,()=>{ msg.textContent='10の へやから '+fromTen+' を とる';
      frameCells($('#ovFrame'),10-fromTen,10,52,10); SFX.ten(); }]);
    T.push([2100,()=>{ msg.textContent='のこりは '+p.ans; }]);
    T.push([2600,fin]);
  }
  T.forEach(([t,f])=>setTimeout(()=>{ if(!skipped)f(); },RM?t*0.4:t));
}
function quickExplain(p,cb){
  const ov=$('#ov'); ov.classList.add('on');
  $('#ovMsg').textContent=p.type==='add'
    ? '10と '+(p.b-(10-p.a))+'で '+p.ans : 'のこりは '+p.ans;
  frameCells($('#ovFrame'),p.type==='add'?10:10-(p.b-(p.a-10)),10,52,10);
  $('#ovFrameBox').classList.add('gold'); $('#ovExtras').innerHTML='';
  setTimeout(()=>{ ov.classList.remove('on'); cb&&cb(); },1000);
}

/* ---- feedback fx ---- */
function flash(t){ const e=$('#fb'); e.textContent=t; e.classList.remove('show');
  void e.offsetWidth; e.classList.add('show'); }
function confetti(){
  if(RM)return;
  const host=$('#s-play'), cols=['#ffd86b','#8fd97a','#9fd4f5','#ff9c7a','#e2a6f0'];
  for(let i=0;i<12;i++){
    const d=document.createElement('div'); d.className='conf';
    d.style.background=cols[i%cols.length];
    d.style.left=(G.basket-10+rnd(20))+'px'; d.style.top='600px';
    host.appendChild(d);
    const dx=(rnd(240)-120), dy=-(120+rnd(120));
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:'translate('+dx+'px,'+dy+'px) rotate(360deg)',opacity:0}],
      {duration:1000,easing:'ease-out'}).onfinish=()=>d.remove();
  }
}

/* ---- log ---- */
function logAttempt(kind,val){
  if(G.demo)return;
  G.log.push({t:'try',expr:(G.cur.expr||'').replace(' ＝ ?',''),ans:G.cur.ans,
    kind,val,tries:G.tries,step:G.cur.step||''});
}

/* ---- end ---- */
function endSession(){
  if(G.ended)return; G.ended=true;   // 二重終了ガード
  bgmStop(); G.sessions++; SFX.fanfare();
  const need=Math.max(0,10-0);
  show('s-result');
  $('#r-title').textContent=G.collected+'こ とれたね!';
  const host=$('#rFruits'); host.innerHTML='';
  for(let i=0;i<G.collected;i++){
    setTimeout(()=>{ const d=document.createElement('div');
      d.style.cssText='position:absolute;width:52px;height:52px;border-radius:50%;background:#ff8b5e;border:4px solid #e2603a;'
        +'left:'+(20+(i%6)*54)+'px;top:'+(30+Math.floor(i/6)*58)+'px';
      d.animate([{transform:'translateY(-150px)',opacity:0},{transform:'translateY(0)',opacity:1}],
        {duration:420,easing:'ease-out'});
      host.appendChild(d); SFX.pop(); },i*150);
  }
  const st=['🍄','🌰','🍃','🐦','🌈'][rnd(5)]; G.stamps.push(st);
  $('#r-stamps').innerHTML='<div style="font-size:26px;color:#4a6b52;margin-bottom:8px">きょうの スタンプ</div>'
    +G.stamps.map(s=>'<span class="stamp">'+s+'</span>').join('');
  say(G.collected+'こ とれたね');
  const rest=G.sessions%2===0;
  $('#restMsg').classList.toggle('hidden',!rest);
  if(rest){ [$('#b-again'),$('#b-other')].forEach(b=>{ b.style.opacity=.4; b.style.pointerEvents='none'; });
    setTimeout(()=>{ $('#restMsg').classList.add('hidden');
      [$('#b-again'),$('#b-other')].forEach(b=>{b.style.opacity=1;b.style.pointerEvents='auto';}); },30000); }
}

/* ---- parent summary ---- */
const KINDJA={decomp:'10の合成の分解ミス',count:'数え間違い',reverse:'上下逆に引く',
  addend:'加数の分解ミス',miss:'取り逃し',correct:'正解','cherry-ok':'さくらんぼで正解'};
const ADVICE={decomp:'「あと いくつで 10?」と口頭で聞いてみてください。10の補数がまだ自動化していません。',
  count:'おはじきや指で1個ずつ数える練習を。数唱と指差しがずれています。',
  reverse:'「3から7は引けるね?」と問いかけて、10の束を崩す操作をブロックで見せてください。',
  miss:'操作にまだ慣れていない様子です。落下速度を下げるか、一緒に画面を触ってみてください。',
  addend:'たす数がいくつだったかを声に出して確認させてください。'};
$('#b-parent').onclick=()=>{ SFX.tap(); renderParent(); show('s-parent'); };
$('#b-back2').onclick=()=>{ SFX.tap(); show('s-result'); };
function renderParent(){
  const cn={add:'たしざん',sub:'ひきざん',mix:'まぜこぜ'}[G.course];
  const mins=Math.max(1,Math.round((Date.now()-G.startAt)/60000));
  const tries=G.log.filter(l=>l.t==='try');
  const wrongs=tries.filter(l=>l.kind!=='correct'&&l.kind!=='cherry-ok');
  const tally={}; wrongs.forEach(w=>tally[w.kind]=(tally[w.kind]||0)+1);
  const cherries=G.log.filter(l=>l.t==='cherry');
  const minis=G.log.filter(l=>l.t==='mini');
  const worst=Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0];
  const rows=[
    ['コースと日時',cn+'コース／'+new Date(G.startAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'開始・約'+mins+'分'],
    ['出題数',G.served+'問（再出題を含む）'],
    ['1回目で正解',G.firstTryOK+'問 / 10問（'+Math.round(G.firstTryOK/10*100)+'%）'],
    ['つまずいた問題', wrongs.length?('<ul style="margin:0;padding-left:18px">'+wrongs.map(w=>
      '<li>'+w.expr+' → '+(w.kind==='miss'?'取り逃し':w.val+'を選択')+'（'+(KINDJA[w.kind]||w.kind)+'）</li>').join('')+'</ul>'):'なし'],
    ['誤答パターンの集計', Object.keys(tally).length?Object.keys(tally).map(k=>(KINDJA[k]||k)+'：'+tally[k]+'回').join('／'):'なし'],
    ['さくらんぼキャッチ発動', cherries.length?cherries.map(c=>c.expr.replace(' ＝ ?','')).join('、'):'なし'],
    ['ミニステージ降下', minis.length?minis.length+'回（10の合成）':'なし'],
    ['声かけのヒント', worst?(ADVICE[worst]||''):'つまずきはほとんどありませんでした。次のコースに進んでよさそうです。']
  ];
  $('#pbox').innerHTML='<h2 style="font-family:sans-serif;font-size:26px;margin-bottom:14px;color:#2f4a33">おうちのかたへ</h2>'
    +'<table class="sum">'+rows.map(r=>'<tr><th>'+r[0]+'</th><td>'+r[1]+'</td></tr>').join('')+'</table>'
    +'<p style="font-family:sans-serif;font-size:15px;color:#6b7a6d;margin-top:14px">'
    +'※記録はこの画面を閉じるまでの一時的なものです。</p>';
}

/* ---- nav ---- */
$('#b-start').onclick=()=>{ ac(); SFX.tap(); show('s-course'); };
$('#b-back1').onclick=()=>{ SFX.tap(); show('s-title'); };
$$('.crs').forEach(b=>b.onclick=()=>{ ac(); SFX.tap(); startSession(b.dataset.c); });
$('#b-again').onclick=()=>{ SFX.tap(); startSession(G.course); };
$('#b-other').onclick=()=>{ SFX.tap(); bgmStop(); show('s-course'); };
$('#b-quit').onclick=()=>{ SFX.tap(); bgmStop(); clearFruits(); G.phase='idle'; show('s-title'); };
$('#spk').onclick=e=>{ e.stopPropagation(); SFX.tap(); G.cur&&say(G.cur.say); };

/* mini resolve hook */
const _resolveCatch=resolveCatch;
resolveCatch=function(f){
  G.phase='resolving'; f.dead=true;
  $('#basket').classList.add('hit'); setTimeout(()=>$('#basket').classList.remove('hit'),400);
  if(G.miniActive) return miniResolve(f);
  if(G.cherry) return cherryResolve(f);
  if(f.opt.k==='correct') onCorrect(); else onWrong(f);
};

fit(); setBasket(512);

/* ---- test hooks ---- */
window.__t={
  G, show, startSession,
  laneOf(v){ const i=G.fruits.findIndex(f=>f.opt.v===v); return i<0?-1:G.fruits[i].lane; },
  values(){ return G.fruits.map(f=>f.opt.v); },
  correctValue(){ const f=G.fruits.find(f=>f.opt.k==='correct'); return f?f.opt.v:null; },
  aim(v){ const f=G.fruits.find(f=>f.opt.v===v); if(!f)return false; setBasket(f.x); return true; },
  aimKind(k){ const f=G.fruits.find(f=>f.opt.k===k); if(!f)return false; setBasket(f.x); return true; },
  aimGap(){ setBasket(90); return true; },
  turbo(s){ G.speed=s||1.2; },
  phase(){ return G.phase; },
  ready(){ return G.phase==='falling'&&G.fruits.length>0; },
  auto(kind){ // 毎フレーム指定種別のレーンへ追従（取りこぼし競合の排除）
    G._auto=kind;
    if(G._autoRaf)return;
    const tick=()=>{ G._autoRaf=requestAnimationFrame(tick);
      if(!G._auto||G.phase!=='falling')return;
      let f;
      if(G._auto==='gap'){ setBasket(341); return; }  // レーン間の谷（どのレーンからも170px）
      f=G.fruits.find(x=>x.opt.k===G._auto&&!x.dead)
        ||(G._auto!=='correct'?G.fruits.find(x=>x.opt.k!=='correct'&&!x.dead):null);
      if(f)setBasket(f.x);
    }; tick();
  },
  autoOff(){ G._auto=null; },
  nothink(v){ G._nothink=v!==false; }
};
