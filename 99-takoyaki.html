<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>たこやき くくやさん</title>
<style>
  :root{
    --paper:#fff3df;      /* 屋台のちょうちんの明かり色 */
    --noren:#24457f;      /* のれん紺 */
    --noren2:#1a3462;
    --wood:#8a5a2b;
    --wood2:#6e4520;
    --tako:#d98e2b;       /* たこやき生地 */
    --tako2:#b96a1f;
    --sauce:#7a3d12;
    --red:#e94f37;        /* 屋台の赤 */
    --green:#4d8f4d;      /* あおのり */
    --ink:#3a2a1a;
    --white:#fffdf7;
    --gold:#f2b134;
    --shadow:0 6px 0 rgba(58,42,26,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","HGMaruGothicMPRO","Yu Gothic UI","Meiryo",sans-serif;
    background:
      radial-gradient(circle at 50% -10%, #ffe9bf 0%, var(--paper) 55%),
      var(--paper);
    color:var(--ink);
    font-size:28px;
    line-height:1.5;
    user-select:none;-webkit-user-select:none;
    overflow:hidden;
    touch-action:manipulation;
  }
  #app{max-width:760px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;}

  /* ===== ヘッダー ===== */
  #hud{display:none;align-items:center;gap:10px;padding:10px 14px;}
  #hud.show{display:flex;}
  .hud-btn{
    min-width:64px;min-height:64px;border:none;border-radius:18px;
    background:var(--white);box-shadow:var(--shadow);font-size:30px;cursor:pointer;
  }
  .hud-btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(58,42,26,.18);}
  #progress{flex:1;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;}
  .pdot{width:22px;height:22px;border-radius:50%;background:#e5d3b3;border:3px solid #d8c29c;transition:.3s;}
  .pdot.done{background:var(--tako);border-color:var(--tako2);}
  .pdot.now{background:var(--gold);border-color:#d0932a;transform:scale(1.25);}

  /* ===== 画面共通 ===== */
  .scr{display:none;flex:1;flex-direction:column;align-items:center;padding:12px 18px 20px;overflow:hidden;}
  .scr.show{display:flex;}
  h1,h2{font-weight:800;}
  .btn{
    border:none;cursor:pointer;font-family:inherit;font-weight:800;color:#fff;
    background:var(--red);border-radius:26px;box-shadow:0 7px 0 #b73320;
    font-size:36px;padding:18px 44px;min-height:80px;
  }
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #b73320;}
  .btn.sub{background:var(--noren);box-shadow:0 7px 0 var(--noren2);font-size:28px;min-height:75px;}
  .btn.sub:active{box-shadow:0 2px 0 var(--noren2);}
  .btn:disabled{opacity:.45;pointer-events:none;}

  /* ===== タイトル ===== */
  #scr-title{justify-content:center;gap:26px;}
  #noren{width:min(92%,560px);}
  .title-logo{font-size:46px;color:var(--noren);text-align:center;letter-spacing:.04em;
    text-shadow:2px 2px 0 #fff;}
  .title-sub{font-size:24px;color:var(--wood2);text-align:center;}

  /* ===== だんえらび ===== */
  #scr-dan{gap:14px;justify-content:center;}
  #dan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(94%,560px);}
  .dan-btn{
    position:relative;border:none;border-radius:22px;cursor:pointer;font-family:inherit;
    background:var(--white);box-shadow:var(--shadow);
    min-height:96px;font-size:34px;font-weight:800;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  }
  .dan-btn:active{transform:translateY(3px);}
  .dan-btn .stamps{font-size:20px;letter-spacing:2px;min-height:24px;}
  .dan-btn.mix{grid-column:1 / -1;background:var(--gold);color:#5a3c07;min-height:86px;}

  /* ===== ゲーム画面 ===== */
  #scr-game{padding:0 14px 14px;gap:6px;}
  #order-row{display:flex;align-items:flex-start;gap:10px;width:100%;flex-shrink:0;}
  #bubble{
    flex:1;background:var(--white);border-radius:24px;box-shadow:var(--shadow);
    padding:12px 16px;font-size:clamp(21px,3.2vh,30px);font-weight:800;position:relative;
    display:flex;align-items:center;gap:10px;
  }
  #bubble-text{flex:1;}
  #stage{flex:1;width:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;overflow:hidden;}

  /* --- つめるモード(サイズは JS が --slot で自動調整。スクロールさせない) --- */
  #boxes{
    flex:1 1 auto;min-height:0;width:100%;overflow:hidden;
    display:flex;flex-direction:column;gap:var(--bgap,6px);align-items:center;justify-content:center;
  }
  .box{
    display:flex;gap:var(--bgap,6px);padding:var(--bpad,8px);background:#f7e6c8;
    border:var(--bbor,3px) solid #caa268;
    border-radius:12px;transition:transform .4s, box-shadow .3s;flex-shrink:0;
  }
  .box.full{border-color:var(--tako2);background:#ffe9c2;}
  .slot{width:var(--slot,52px);height:var(--slot,52px);border-radius:50%;background:rgba(0,0,0,.08);
    border:2px dashed #c9a76f;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .slot svg,.slot img{width:100%;height:100%;}
  .slot.filled{border-style:solid;border-color:transparent;background:transparent;animation:pop .3s;}
  #numpad-mount{flex-shrink:0;}
  @keyframes pop{0%{transform:scale(.3);}70%{transform:scale(1.2);}100%{transform:scale(1);}}
  #add-btn{margin-top:2px;flex-shrink:0;font-size:clamp(26px,4.4vh,36px);padding:14px 34px;min-height:clamp(64px,10vh,80px);}
  #count-text{flex-shrink:0;font-size:clamp(20px,3.4vh,28px);font-weight:800;color:var(--wood2);text-align:center;}
  #count-text #count-num{color:var(--red);font-size:1.2em;}

  /* --- しき・こたえ --- */
  #eq{font-size:clamp(34px,5.4vh,52px);font-weight:800;letter-spacing:.05em;
    display:flex;align-items:center;gap:8px;flex-shrink:0;}
  #eq .blank{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.35em;
    border-radius:16px;background:var(--white);box-shadow:inset 0 0 0 4px var(--gold);}
  #eq .lit{color:var(--red);}

  /* --- 数字パッド(5列3段。縦を節約して たこやきの場所を確保) --- */
  #numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:min(96%,430px);}
  .np{
    min-height:clamp(52px,7.6vh,72px);font-size:clamp(26px,4.2vh,36px);font-weight:800;
    border:none;border-radius:16px;cursor:pointer;
    background:var(--white);box-shadow:var(--shadow);color:var(--ink);font-family:inherit;
  }
  .np:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(58,42,26,.18);}
  .np.ok{background:var(--red);color:#fff;box-shadow:0 6px 0 #b73320;grid-column:span 3;}
  .np.del{background:#e8dcc4;font-size:clamp(20px,3.2vh,26px);grid-column:span 2;}
  #numpad-mount{flex-shrink:0;}

  /* --- となえる(セルサイズは JS が --acell で自動調整) --- */
  #chant-area{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;flex:1;min-height:0;}
  #array-wrap{flex:1 1 auto;min-height:0;width:100%;overflow:hidden;
    display:flex;flex-direction:column;gap:4px;padding:4px;align-items:center;justify-content:center;}
  .arow{display:flex;gap:4px;flex-shrink:0;align-items:center;}
  .acell{width:var(--acell,40px);height:var(--acell,40px);flex-shrink:0;}
  .acell svg,.acell img{width:100%;height:100%;object-fit:contain;}
  .arow.hl .acell{filter:drop-shadow(0 0 6px var(--gold));transform:scale(1.08);}
  .row-total{flex-shrink:0;min-width:1.6em;margin-left:6px;font-weight:800;color:var(--red);
    font-size:clamp(16px,2.6vh,26px);opacity:0;transition:opacity .3s;text-align:left;}
  .row-total.show{opacity:1;}
  #chant-text{font-size:clamp(24px,4vh,34px);font-weight:800;color:var(--noren);text-align:center;flex-shrink:0;}

  /* --- フィードバック --- */
  #fb{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:50;}
  #fb.show{display:flex;}
  #fb-inner{font-size:clamp(40px,8vh,60px);font-weight:800;padding:20px 46px;border-radius:32px;animation:fbin .4s;}
  #fb-inner.good{background:rgba(255,253,247,.95);color:var(--red);box-shadow:0 0 0 8px var(--gold);}
  #fb-inner.oshii{background:rgba(255,253,247,.9);color:var(--noren);font-size:clamp(28px,5.5vh,40px);}
  @keyframes fbin{0%{transform:scale(.4);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}

  /* --- かぞえるモーダル --- */
  #modal{position:absolute;inset:0;background:rgba(58,42,26,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:10px;}
  #modal.show{display:flex;}
  #modal-card{background:var(--white);border-radius:28px;padding:16px;max-width:96%;max-height:92dvh;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 12px 0 rgba(58,42,26,.25);}
  #modal-title{font-size:clamp(22px,3.6vh,30px);font-weight:800;color:var(--noren);flex-shrink:0;}
  #modal-array{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;overflow:hidden;}
  #modal-count{font-size:clamp(34px,6vh,48px);font-weight:800;color:var(--red);min-height:1.2em;flex-shrink:0;}

  /* ===== けっか ===== */
  #scr-result{justify-content:center;gap:16px;text-align:center;}
  #stamp-card{
    background:var(--white);border-radius:26px;box-shadow:var(--shadow);padding:22px 30px;
    display:flex;flex-direction:column;gap:8px;align-items:center;min-width:min(90%,480px);
  }
  #stamp-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:44px;}
  .stamp{animation:pop .5s both;}
  #result-msg{font-size:34px;font-weight:800;color:var(--red);}
  #parent-sum{
    display:none;background:#f4ead6;border-radius:18px;padding:14px 18px;font-size:20px;text-align:left;
    max-width:min(92%,520px);color:#4a3a24;line-height:1.7;
  }
  #parent-sum.show{display:block;}
  #parent-toggle{background:none;border:none;font-size:20px;color:var(--wood2);text-decoration:underline;cursor:pointer;font-family:inherit;padding:10px;}
  #rest-msg{display:none;font-size:26px;font-weight:800;color:var(--noren);background:var(--white);
    border-radius:18px;padding:12px 22px;box-shadow:var(--shadow);}
  #rest-msg.show{display:block;}

  .hint-small{font-size:22px;color:var(--wood2);font-weight:800;}  .fade-in{animation:fade .5s both;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

  /* キラキラ */
  .spark{position:absolute;font-size:34px;pointer-events:none;animation:spark 1s forwards;z-index:55;}
  @keyframes spark{0%{transform:translateY(0) scale(.5);opacity:1;}100%{transform:translateY(-90px) scale(1.3);opacity:0;}}

  /* 横向きスマホなど縦が極端に狭い画面: たこやきと入力を左右に並べる */
  @media (orientation:landscape) and (max-height:620px){
    #hud{padding:4px 10px;gap:8px;}
    .hud-btn{min-width:52px;min-height:52px;font-size:24px;border-radius:14px;}
    .pdot{width:14px;height:14px;border-width:2px;}
    #bubble{font-size:clamp(17px,3.6vh,24px);padding:8px 12px;}
    #stage{flex-direction:row;align-items:center;justify-content:center;gap:10px;}
    #boxes{width:auto;height:100%;flex:1 1 0;}
    #eq{flex-shrink:0;font-size:clamp(26px,7vh,40px);}
    #add-btn{font-size:clamp(20px,5.5vh,30px);padding:10px 20px;min-height:clamp(48px,12vh,64px);}
    #count-text{font-size:clamp(15px,3.6vh,20px);}
    #numpad{width:min(46vw,340px);}
    #numpad .np{min-height:clamp(40px,13vh,60px);font-size:clamp(20px,6vh,30px);}
    #chant-area{flex-direction:row;align-items:center;gap:10px;}
    #array-wrap{height:100%;}
    #fb-inner{font-size:34px;padding:14px 30px;}
  }
</style>
</head>

    <button class="hud-btn" id="home-btn" aria-label="やめる">🏠</button>
    <div id="progress"></div>
    <button class="hud-btn" id="mute-btn" aria-label="おと">🔊</button>
  </div>

<script>
'use strict';
/* =========================================================
   たこやき くくやさん — 小2 乗法(九九) 学習ソフト
   単一HTML / 外部アセットなし / Web Audio + Web Speech
   ========================================================= */

/* ---------- 音声(Web Speech) ---------- */
let voiceOn = true;
function speak(text, opt = {}) {
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = opt.rate || 0.95; u.pitch = opt.pitch || 1.15;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- 効果音(game-sfx-designer ミニエンジン簡約版) ---------- */
const AudioSys = (() => {
  let ctx = null, master, sfxBus;
  let muted = false;
  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); sfxBus = ctx.createGain();
    sfxBus.connect(master); master.connect(ctx.destination);
    return ctx;
  }
  document.addEventListener('pointerdown', ensure, { passive: true });
  // ノードベース: 音程が重要な音(正解/不正解/ジングル)
  function tone({ freq = 440, shape = 'sine', when = 0, dur = 0.15, attack = 0.008, volume = 0.35 }) {
    const c = ensure(); const t0 = (when || c.currentTime) + 0.02;
    const o = c.createOscillator(); o.type = shape;
    o.frequency.value = freq * (1 + (Math.random() * 2 - 1) * 0.015); // 繰り返し疲労防止の微揺らぎ
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(volume, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(sfxBus); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  const S = {
    tap()    { tone({ freq: 1600, dur: .05, volume: .12 }); },                       // UI blip(控えめ)
    place()  { tone({ freq: 320, shape: 'triangle', dur: .1, volume: .3 });          // たこやき「ぽこっ」
               tone({ freq: 480, shape: 'sine', dur: .07, volume: .15 }); },
    good()   { const c = ensure(), t = c.currentTime;                                // 上行 長3度 E5→G#5
               tone({ freq: 659, when: t,        dur: .16, volume: .4 });
               tone({ freq: 831, when: t + .12,  dur: .3,  volume: .4 }); },
    oshii()  { const c = ensure(), t = c.currentTime;                                // 柔らかい下行2音
               tone({ freq: 330, when: t,        dur: .14, volume: .22, attack: .012 });
               tone({ freq: 294, when: t + .14,  dur: .2,  volume: .2,  attack: .012 }); },
    count()  { tone({ freq: 880, dur: .09, volume: .25 }); },                        // かぞえの「ピッ」
    fanfare(){ const c = ensure(), t = c.currentTime;                                // C-E-G-C 上行ジングル
               [523, 659, 784, 1047].forEach((f, i) =>
                 tone({ freq: f, when: t + i * .13, dur: i === 3 ? .5 : .15, volume: .4 })); },
    stamp()  { const c = ensure(), t = c.currentTime;
               tone({ freq: 160, shape: 'triangle', when: t, dur: .1, volume: .4 });
               tone({ freq: 1319, when: t + .08, dur: .2, volume: .3 }); }
  };
  return { S, get muted() { return muted; },
    toggleMute() { ensure(); muted = !muted; master.gain.value = muted ? 0 : 1; return muted; } };
})();
const SFX = AudioSys.S;

/* ---------- 九九データ ---------- */
const CHANT = {
 1:['いんいちが いち','いんにが に','いんさんが さん','いんしが し','いんごが ご','いんろくが ろく','いんしちが しち','いんはちが はち','いんくが く'],
 2:['にいちが に','ににんが し','にさんが ろく','にしが はち','にご じゅう','にろく じゅうに','にしち じゅうし','にはち じゅうろく','にく じゅうはち'],
 3:['さんいちが さん','さんにが ろく','さざんが く','さんし じゅうに','さんご じゅうご','さぶろく じゅうはち','さんしち にじゅういち','さんぱ にじゅうし','さんく にじゅうしち'],
 4:['しいちが し','しにが はち','しさん じゅうに','しし じゅうろく','しご にじゅう','しろく にじゅうし','ししち にじゅうはち','しは さんじゅうに','しく さんじゅうろく'],
 5:['ごいちが ご','ごに じゅう','ごさん じゅうご','ごし にじゅう','ごご にじゅうご','ごろく さんじゅう','ごしち さんじゅうご','ごは しじゅう','ごっく しじゅうご'],
 6:['ろくいちが ろく','ろくに じゅうに','ろくさん じゅうはち','ろくし にじゅうし','ろくご さんじゅう','ろくろく さんじゅうろく','ろくしち しじゅうに','ろくは しじゅうはち','ろっく ごじゅうし'],
 7:['しちいちが しち','しちに じゅうし','しちさん にじゅういち','しちし にじゅうはち','しちご さんじゅうご','しちろく しじゅうに','しちしち しじゅうく','しちは ごじゅうろく','しちく ろくじゅうさん'],
 8:['はちいちが はち','はちに じゅうろく','はちさん にじゅうし','はちし さんじゅうに','はちご しじゅう','はちろく しじゅうはち','はちしち ごじゅうろく','はっぱ ろくじゅうし','はっく しちじゅうに'],
 9:['くいちが く','くに じゅうはち','くさん にじゅうしち','くし さんじゅうろく','くご しじゅうご','くろく ごじゅうし','くしち ろくじゅうさん','くは しちじゅうに','くく はちじゅういち']
};
const ONES = ['ぜろ','いち','に','さん','よん','ご','ろく','なな','はち','きゅう'];
function yomi(n){ // 1〜99 のよみ(かぞえ用)
  if (n < 10) return ONES[n];
  const t = Math.floor(n / 10), o = n % 10;
  return (t > 1 ? ONES[t] : '') + 'じゅう' + (o ? ONES[o] : '');

/* ---------- 状態 ---------- */
const state = {
  sessions: 0,                 // 完了セッション数(きゅうけい判定)
  stamps: {},                  // 段ごとのスタンプ数 {3:1,...}
  missLog: {},                 // 通算ミス {'3x7': 2}
  learned: new Set()           // セッション完了した段
};
let session = null;            // 現在のセッション

/* ---------- 画面ユーティリティ ---------- */
const $ = id => document.getElementById(id);
function show(id) {
  document.querySelectorAll('.scr').forEach(s => s.classList.remove('show'));
  $(id).classList.add('show');
  $('hud').classList.toggle('show', id === 'scr-game');
}
function setBubble(text, speakText) {
  $('bubble-text').innerHTML = text;
  $('bubble').__speak = speakText || text.replace(/<[^>]+>/g, '');
  speak($('bubble').__speak);
}
function feedback(kind, text, dur = 1100) {
  const fb = $('fb'), inner = $('fb-inner');
  inner.className = kind; inner.textContent = text;
  fb.classList.add('show');
  return new Promise(r => setTimeout(() => { fb.classList.remove('show'); r(); }, dur));
}
function sparkle(n = 6) {
  const app = $('app');
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'spark'; s.textContent = ['✨','🌟','⭐'][i % 3];
    s.style.left = (20 + Math.random() * 60) + '%';
    s.style.top  = (30 + Math.random() * 40) + '%';
    s.style.animationDelay = (Math.random() * .3) + 's';
    app.appendChild(s); setTimeout(() => s.remove(), 1400);
  }
}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- セッション生成 ---------- */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function buildSession(dan) {
  const q = [];
  if (dan === 'mix') {
    // ミックス: 学んだ段(なければ全段)からランダム10問、うち2問むしくい。苦手を優先。
    const dans = state.learned.size ? [...state.learned] : [2,3,4,5];
    const pool = [];
    dans.forEach(d => { for (let i = 1; i <= 9; i++) pool.push([d, i]); });
    shuffle(pool);
    // ミスの多い九九を先頭に
    pool.sort((a, b) => (state.missLog[b[0]+'x'+b[1]] || 0) - (state.missLog[a[0]+'x'+a[1]] || 0));
    const picked = pool.slice(0, 10);
    shuffle(picked);
    picked.forEach(([d, i], k) => q.push({ type: 'quiz', d, i, mushi: k >= 8 }));
  } else {
    const d = dan;
    const fills = shuffle([2, 3, 4, 5]);
    q.push({ type: 'demo', d, i: fills[0] });
    q.push({ type: 'fill', d, i: fills[1] });
    q.push({ type: 'fill', d, i: fills[2] });
    q.push({ type: 'chant', d });
    const ms = shuffle([1,2,3,4,5,6,7,8,9]).slice(0, 6);
    ms.forEach((i, k) => q.push({ type: 'quiz', d, i, mushi: k >= 4 && i * d > 4 }));
  }
  session = {
    dan, queue: q, idx: 0,
    misses: {},           // このセッションのミス {'3x7':1}
    firstTry: 0, answered: 0,
    requeued: new Set()
  };
}

/* ---------- 進捗ドット ---------- */
function renderProgress() {
  const p = $('progress'); p.innerHTML = '';
  session.queue.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'pdot' + (i < session.idx ? ' done' : i === session.idx ? ' now' : '');
    p.appendChild(d);
  });
}

/* ---------- メインループ ---------- */
function nextItem() {
  if (!session) return;
  if (session.idx >= session.queue.length) return endSession();
  renderProgress();
  const item = session.queue[session.idx];
  if (item.type === 'demo')  runDemo(item);
  else if (item.type === 'fill')  runFill(item, false);
  else if (item.type === 'chant') runChant(item);
  else runQuiz(item);
}
function advance() { session.idx++; nextItem(); }

/* ---------- 誤答の記録と再出題(2〜3問あとに同じ九九) ---------- */
function recordMiss(d, i) {
  const key = d + 'x' + i;
  session.misses[key] = (session.misses[key] || 0) + 1;
  state.missLog[key] = (state.missLog[key] || 0) + 1;
  if (!session.requeued.has(key)) {
    session.requeued.add(key);
    const pos = Math.min(session.idx + 3, session.queue.length);
    session.queue.splice(pos, 0, { type: 'quiz', d, i, mushi: false, retry: true });
  }
}

/* =========================================================
   ② つめる: 注文どおりに詰める → 全部で何個? を答える
   ========================================================= */
function buildBoxUI(d, i, demo) {
  const st = $('stage');
  st.innerHTML = `
    <div id="boxes"></div>
    <div id="eq" ${demo ? 'style="font-size:40px"' : ''}><span id="eq-demo"></span></div>
    ${demo ? '' : `
    <div id="count-text">${d}こ はいった はこが <span id="count-num">0</span>こ</div>
    <button class="btn" id="add-btn">${d}こ ふやす ⊕</button>`}
  `;
  const boxes = $('boxes');
  for (let b = 0; b < i; b++) {
    const box = document.createElement('div'); box.className = 'box';
    for (let s = 0; s < d; s++) { const sl = document.createElement('div'); sl.className = 'slot'; box.appendChild(sl); }
    boxes.appendChild(box);
  }
  fitLater(() => fitBoxes(d, i));
  return boxes;
}

/* ---------- 画面に必ず収める自動サイズ調整 ----------
   9×9(81こ)でもスクロールなしで全部見えるよう、たこやきの大きさを実測して決める */
function fitLater(fn) { requestAnimationFrame(() => requestAnimationFrame(fn)); }

function fitBoxes(d, i) {
  const boxes = $('boxes'); if (!boxes) return;
  // 箱が多い/横に長いときは枠の余白を詰めて、たこやき本体を大きく保つ
  const tight = i >= 4, many = i >= 6;
  const GAP = (tight || d >= 6) ? 4 : 6;
  const PAD = many ? 3 : tight ? 4 : 8;
  const BORDER = tight ? 2 : 3;
  const availW = boxes.clientWidth  - 4;
  const availH = boxes.clientHeight - 4;
  if (availW <= 0 || availH <= 0) return;
  const byW = (availW - (d - 1) * GAP - 2 * (PAD + BORDER)) / d;
  const byH = (availH - (i - 1) * GAP - i * 2 * (PAD + BORDER)) / i;
  const slot = Math.max(12, Math.min(56, Math.floor(Math.min(byW, byH))));
  boxes.style.setProperty('--slot', slot + 'px');
  boxes.style.setProperty('--bgap', GAP + 'px');
  boxes.style.setProperty('--bpad', PAD + 'px');
  boxes.style.setProperty('--bbor', BORDER + 'px');
  boxes.__refit = () => fitBoxes(d, i);
}

// avail を渡すと実測でなく指定領域に収める(モーダルなど自動幅の要素向け)
function fitArray(wrap, cols, rows, maxCell = 44, avail = null) {
  if (!wrap) return;
  const GAP = 4;
  const availW = (avail ? avail.w : wrap.clientWidth)  - 8;
  const availH = (avail ? avail.h : wrap.clientHeight) - 8;
  if (availW <= 0 || availH <= 0) return;
  const byW = (availW - (cols - 1) * GAP) / cols;
  const byH = (availH - (rows - 1) * GAP) / rows;
  const cell = Math.max(12, Math.min(maxCell, Math.floor(Math.min(byW, byH))));
  wrap.style.setProperty('--acell', cell + 'px');
  wrap.__refit = () => fitArray(wrap, cols, rows, maxCell, avail);
}

// 画面回転・リサイズでも収まりを保つ
let fitTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => {
    ['boxes', 'array-wrap', 'modal-array'].forEach(id => {
      const el = $(id); if (el && el.__refit) el.__refit();
    });
  }, 150);
});
function fillSlot(boxes, b, s) {
  const slot = boxes.children[b].children[s];
  slot.classList.add('filled'); slot.innerHTML = takoSVG();
  if ([...boxes.children[b].children].every(x => x.classList.contains('filled')))
    boxes.children[b].classList.add('full');
}

async function runFill({ d, i }) {
  setBubble(`「たこやき <b>${d}こずつ、${i}はこ</b> ください!」<br>ボタンで はこを ふやしてね`,
    `たこやき ${d}こずつ、${i}はこ ください! ボタンを おして はこを ふやしてね`);
  const boxes = buildBoxUI(d, i, false);
  let boxesDone = 0;   // 何箱ぶん詰め終わったか
  const addBtn = $('add-btn');

  function fillOneBox() {
    if (boxesDone >= i) return;
    const b = boxesDone;
    for (let s = 0; s < d; s++) fillSlot(boxes, b, s);   // 1箱ぶん まとめて詰める(音は1回)
    SFX.place();
    boxesDone++;
    const numEl = $('count-num'); if (numEl) numEl.textContent = boxesDone;
    speak(`${d}こ はいった はこが ${yomi(boxesDone)}こ`);
    if (boxesDone >= i) {
      addBtn.disabled = true; addBtn.textContent = 'できた!';
      setTimeout(askTotal, 500);
    }
  }
  addBtn.addEventListener('click', () => {
    SFX.tap(); addBtn.disabled = true;
    fillOneBox();
    setTimeout(() => { if (boxesDone < i) addBtn.disabled = false; }, 350);
  });

  // ぜんぶで なんこ?
  function askTotal() {
    SFX.good();
    setBubble(`つめてくれて ありがとう!<br><b>ぜんぶで なんこ</b> かな?`, `つめてくれて ありがとう! ぜんぶで なんこ かな?`);
    $('eq').innerHTML = `${d} × ${i} = <span class="blank" id="ans-box">?</span>`;
    if (addBtn) addBtn.remove();
    mountNumpad(d * i, {
      onCorrect: async () => {
        $('ans-box').textContent = d * i; $('ans-box').classList.add('lit');
        await onCorrectCommon(d, i, `${d}こずつが ${i}はこで、${yomi(d*i)}こ! おいしそう!`);
        advance();
      },
      onWrong: wrongHandler(d, i, () => askTotal_afterHint(d, i))
    });
    fitLater(() => fitBoxes(d, i));   // 数字パッドのぶん場所が減るので詰め直す
  }
  function askTotal_afterHint(d, i) { /* かぞえモーダル後にもう一度入力させる: numpadは残っている */ }
}

/* =========================================================
   ③ となえる: 1列ずつ増えるのを見ながら 段を唱える

async function runChant({ d }) {
  setBubble(`つぎは <b>${d}のだん</b>を いっしょに となえよう!<br>ボタンを おすたびに 1れつ ふえるよ`,

/* =========================================================
   ④ ちゅうもん(習熟クイズ): 式 → 数字パッド。むしくい対応
   ========================================================= */
function runQuiz({ d, i, mushi, retry }) {
  const p = d * i;
  const orderText = retry
    ? `さっきの もういっかい!<br><b>${d} × ${i}</b> は?`
    : mushi
      ? `「${d}を <b>なんかい</b>で ${p}こに してね!」`
      : `「<b>${d} × ${i}</b> の たこやき ください!」`;
  const orderSpeak = retry ? `さっきの もういっかい! ${d} かける ${i} は?`
    : mushi ? `${d}を なんかいで ${p}こに なるかな?`
    : `${d} かける ${i} の たこやき ください!`;
  setBubble(orderText, orderSpeak);
  const st = $('stage');
  st.innerHTML = `<div id="eq"></div><div id="numpad-mount" style="display:flex;justify-content:center;width:100%;"></div>`;
  if (mushi)
    $('eq').innerHTML = `${d} × <span class="blank" id="ans-box">?</span> = ${p}`;
  else
    $('eq').innerHTML = `${d} × ${i} = <span class="blank" id="ans-box">?</span>`;
  const answer = mushi ? i : p;
  mountNumpad(answer, {
    onCorrect: async () => {
      $('ans-box').textContent = answer; $('ans-box').classList.add('lit');
      await onCorrectCommon(d, i, `せいかい! ${CHANT[d][i-1]}!`);
      advance();
    },
    onWrong: wrongHandler(d, i, null, mushi)
  });
}

/* ---------- 正答共通演出(大げさに喜ぶ) ---------- */
async function onCorrectCommon(d, i, phrase) {
  SFX.good(); sparkle(8);
  session.answered++;
  const key = d + 'x' + i;
  if (!session.misses[key]) session.firstTry++;
  speak(phrase);
  await feedback('good', ['💮 せいかい!','💮 やったね!','💮 おいしい!'][Math.floor(Math.random()*3)], 1300);
}

/* ---------- 誤答ハンドラ(段階ヒント) ----------
   1回目: 着目点を音声で(答えは言わない)
   2回目: アレイ図で一緒に数える解説 → 同じ問題に再挑戦、あとで類題を再出題 */
function wrongHandler(d, i, afterHint, mushi = false) {
  let wrongs = 0;
  return async (val) => {
    wrongs++;
    recordMiss(d, i);
    SFX.oshii();
    if (wrongs === 1) {
      // 九九の混同検出(同じ段の別の答え/近い段)→段を順に、それ以外→列で数える
      const sameDan = [1,2,3,4,5,6,7,8,9].some(k => k !== i && d * k === val);
      const hint = sameDan
        ? `おしい! ${d}のだんを じゅんばんに いってみよう`
        : `おしい! ${d}こずつ ふえていくよ`;
      speak(hint);
      await feedback('oshii', 'おしい! もういちど', 1400);
    } else {
      speak('いっしょに かぞえて みよう!');
      await feedback('oshii', 'いっしょに かぞえよう', 1200);
      await countTogether(d, i);
      if (mushi) speak(`${d}こずつ ${yomi(i)}はこで ${yomi(d*i)}。こたえは ${yomi(i)} だね`);
      if (afterHint) afterHint();
    }
  };
}

/* ---------- アレイ図で一緒に数えるモーダル ---------- */
function countTogether(d, i) {
  return new Promise(async resolve => {
    const m = $('modal'); m.classList.add('show');
    $('modal-title').textContent = `${d}こずつ かぞえよう`;
    $('modal-count').textContent = '';
    $('modal-btn').style.display = 'none';
    const wrap = $('modal-array'); wrap.innerHTML = '';
    fitArray(wrap, d, i, 44, {
      w: Math.min(window.innerWidth * 0.9 - 40, 620) - 54,   // 行ラベルぶんの幅を確保
      h: window.innerHeight * 0.52
    });
    const rows = [];
    for (let r = 0; r < i; r++) {
      const row = document.createElement('div'); row.className = 'arow';
      for (let s = 0; s < d; s++) { const c = document.createElement('div'); c.className = 'acell'; c.style.opacity = .25; c.innerHTML = takoSVG(false); row.appendChild(c); }
      const label = document.createElement('span'); label.className = 'row-total'; label.textContent = '';
      row.appendChild(label);
      wrap.appendChild(row); rows.push(row);
    }
    await wait(700);
    let total = 0;
    for (let r = 0; r < i; r++) {
      total += d;
      rows[r].querySelectorAll('.acell').forEach(c => c.style.opacity = 1);
      rows.forEach(x => x.classList.remove('hl')); rows[r].classList.add('hl');
      const label = rows[r].querySelector('.row-total');
      const isLast = r === i - 1;
      if (isLast) {
        label.textContent = '?'; label.classList.add('show');
        $('modal-count').textContent = '?';
        SFX.count(); speak('さいごは いくつかな?');
      } else {
        label.textContent = total; label.classList.add('show');
        $('modal-count').textContent = total;
        SFX.count(); speak(yomi(total), { rate: 1.05 });
      }
      await wait(900);
    }
    speak(`${d} かける ${yomi(i)} は、${yomi(d*i)}!`);
    $('modal-count').textContent = `${d} × ${i} = ${d * i}`;
    const lastLabel = rows[i - 1].querySelector('.row-total');
    if (lastLabel) lastLabel.textContent = d * i;
    const btn = $('modal-btn'); btn.style.display = '';
    btn.onclick = () => { SFX.tap(); m.classList.remove('show'); resolve(); };
  });
}

/* ---------- 数字パッド ---------- */
function mountNumpad(answer, { onCorrect, onWrong }) {
  let mount = $('numpad-mount');
  if (!mount) { mount = document.createElement('div'); mount.id = 'numpad-mount';
    mount.style.cssText = 'display:flex;justify-content:center;width:100%;'; $('stage').appendChild(mount); }
  mount.innerHTML = `<div id="numpad">
    ${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button class="np" data-n="${n}">${n}</button>`).join('')}
    <button class="np del" data-a="del">けす</button>
    <button class="np ok" data-a="ok">OK</button>
  </div>`;
  let buf = '';
  const box = () => $('ans-box');
  mount.querySelectorAll('.np').forEach(b => b.addEventListener('pointerup', e => {
    e.preventDefault(); SFX.tap();
    if (b.dataset.n !== undefined) { if (buf.length < 2) buf += b.dataset.n; box().textContent = buf; }
    else if (b.dataset.a === 'del') { buf = ''; box().textContent = '?'; }
    else if (b.dataset.a === 'ok') {
      if (!buf) return;
      const v = parseInt(buf, 10);
      if (v === answer) onCorrect();
      else { buf = ''; box().textContent = '?'; box().parentElement.classList.add('shake');
        setTimeout(() => box().parentElement.classList.remove('shake'), 450); onWrong(v); }
    }
  }));
}

/* =========================================================
   セッション終了: 閉店の儀式 + 保護者サマリ
   ========================================================= */
function endSession() {
  state.sessions++;
  const danLabel = session.dan === 'mix' ? 'ミックス' : session.dan + 'のだん';
  if (session.dan !== 'mix') state.learned.add(session.dan);
  state.stamps[session.dan] = (state.stamps[session.dan] || 0) + 1;

  show('scr-result');
  SFX.fanfare(); sparkle(10);
  const perfect = Object.keys(session.misses).length === 0;
  $('result-msg').textContent = perfect ? '✨ ぜんぶ いっぱつ せいかい!' : 'きょうも よく がんばりました!';
  $('result-detail').textContent = `${danLabel} / ${session.answered}もん こたえたよ`;

  // スタンプ演出
  const row = $('stamp-row'); row.innerHTML = '';
  const stampCount = Math.min(state.stamps[session.dan], 5);
  for (let k = 0; k < stampCount; k++) {
    setTimeout(() => {
      const s = document.createElement('span'); s.className = 'stamp';
      s.textContent = (k === stampCount - 1 && perfect) ? '🌟' : '🐙';
      row.appendChild(s); SFX.stamp();
    }, 600 + k * 350);
  }
  speak(perfect ? 'すごい! ぜんぶ いっぱつ せいかい! きんの スタンプ!' : 'きょうも よく がんばりました! スタンプ ぺったん!');

  // きゅうけいの促し(2セッションごと)
  $('rest-msg').classList.toggle('show', state.sessions % 2 === 0);

  // 保護者向けサマリ
  const sum = $('parent-sum'); sum.classList.remove('show');
  $('parent-toggle').textContent = '▸ おうちのかたへ(きろく)';
  const missKeys = Object.keys(session.misses);
  let html = `<b>本日の記録</b>:${danLabel}/回答 ${session.answered}問中、初回正解 ${session.firstTry}問。<br>`;
  if (missKeys.length === 0) html += 'つまずきなし。次は別の段やミックス(ランダム出題)がおすすめです。';
  else {
    html += 'つまずいた九九(セッション内で再挑戦済み):<br>' + missKeys.map(k => {
      const [d, i] = k.split('x').map(Number);
      return `・${d}×${i}=${d*i}(${CHANT[d][i-1]})… ${session.misses[k]}回`;
    }).join('<br>');
    html += '<br>アレイ図(たこ焼きの箱)を一緒に数え直すと定着しやすい段階です。';
  }
  sum.innerHTML = html;
}
