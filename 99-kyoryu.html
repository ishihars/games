<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>きゅうきゅうハンター</title>
<style>
:root{
  --bg:#EAF6FF; --panel:#FFFFFF; --ink:#3A4256; --sub:#7A86A0;
  --primary:#FF8A3D; --primary-dk:#E8712A; --good:#34B37A; --star:#F2B01E;
  --shadow:0 6px 0 rgba(58,66,86,.12);
  --round:"Hiragino Maru Gothic ProN","BIZ UDGothic","M PLUS Rounded 1c","Yu Gothic UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--round);color:var(--ink)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:
 radial-gradient(circle at 15% 20%, #FFFFFF55 0 120px, transparent 121px),
 radial-gradient(circle at 85% 70%, #FFFFFF44 0 150px, transparent 151px),
 linear-gradient(180deg,#DDF1FF 0%,#EAF6FF 60%,#FDF3E3 100%)}
#stage{position:relative;width:1040px;height:660px;transform-origin:center center}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
button{font-family:var(--round);border:none;cursor:pointer;color:var(--ink)}
button:focus-visible{outline:4px solid #4aa3ff;outline-offset:2px}
button:active{transform:translateY(3px)}
.btn{background:var(--primary);color:#fff;border-radius:24px;box-shadow:0 6px 0 var(--primary-dk);
 font-size:32px;font-weight:bold;padding:20px 48px;min-height:80px;min-width:180px}
.btn.sub{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.btn.green{background:var(--good);box-shadow:0 6px 0 #268A5D;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.small-btn{background:#fff;border-radius:18px;box-shadow:var(--shadow);font-size:22px;font-weight:bold;
 padding:12px 20px;min-height:60px}
/* ---- title ---- */
.title-logo{margin-top:70px;text-align:center}
.title-logo h1{font-size:64px;letter-spacing:.06em;color:var(--ink);
 text-shadow:0 4px 0 #fff, 0 8px 0 rgba(58,66,86,.10)}
.title-logo .dots{display:flex;gap:10px;justify-content:center;margin:18px 0 6px}
.title-logo .dots span{width:26px;height:26px;border-radius:50%;display:inline-block;
 animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.title-note{position:absolute;bottom:14px;font-size:16px;color:var(--sub)}
/* ---- map ---- */
.hud{width:100%;display:flex;justify-content:space-between;align-items:center;padding:18px 30px}
.hud .name{font-size:28px;font-weight:bold}
.map-grid{display:grid;grid-template-columns:repeat(3,236px);grid-auto-rows:128px;gap:20px 46px;margin-top:26px}
.island{position:relative;background:var(--panel);border-radius:28px;box-shadow:var(--shadow);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding-top:10px}
.island.next{outline:6px solid var(--primary);outline-offset:-3px;animation:bob 1.7s ease-in-out infinite}
.island .danface{width:56px;height:56px}
.island .lbl{font-size:22px;font-weight:bold;line-height:1}
.island .order{position:absolute;top:-10px;left:-10px;width:40px;height:40px;border-radius:50%;
 background:var(--ink);color:#fff;font-size:20px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.island .medal{position:absolute;top:-12px;right:-8px;font-size:30px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.island .stepdots{display:flex;gap:6px}
.island .stepdots i{width:14px;height:14px;border-radius:50%;background:#E3E8F2;display:inline-block}
.island .stepdots i.on{background:var(--good)}
.island.master{grid-column:1 / -1;height:84px;flex-direction:row;gap:20px;padding-top:0;background:linear-gradient(90deg,#FFF3D6,#FFE9EF)}
/* ---- dan panel ---- */
.panel-card{background:var(--panel);border-radius:32px;box-shadow:var(--shadow);
 width:760px;padding:34px 44px;display:flex;flex-direction:column;align-items:center;gap:30px;margin-top:14px}
.steprow{display:flex;gap:30px}
.stepbtn{position:relative;width:180px;height:130px;border-radius:24px;background:#F4F7FC;box-shadow:var(--shadow);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:bold}
.stepbtn .t{font-size:26px}
.stepbtn.done{background:#E7F7EF}
.stepbtn.locked{opacity:.4}
/* ---- quiz ---- */
.quiz-top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 24px}
.progress{display:flex;gap:10px;flex-wrap:wrap;max-width:620px;margin-top:4px}
.progress i{width:20px;height:20px;border-radius:50%;background:#DCE4F0;display:inline-block}
.progress i.ok{background:var(--good)}
.progress i.ng{background:#F5B8C4}
.progress i.now{background:var(--primary);animation:bob 1s infinite}
.formula{font-size:84px;font-weight:bold;letter-spacing:.04em;margin-top:18px;display:flex;align-items:center;gap:22px}
.formula .blank{display:inline-flex;width:110px;height:110px;border:6px dashed var(--primary);
 border-radius:22px;align-items:center;justify-content:center;color:var(--primary);background:#FFF7F0;
 animation:blinkb 1.4s infinite}
@keyframes blinkb{0%,100%{border-color:var(--primary)}50%{border-color:#FFD2B0}}
.formula .q{color:var(--primary)}
.answers{display:flex;gap:36px}
.choice{width:206px;height:122px;border-radius:28px;background:#fff;box-shadow:var(--shadow);
 font-size:56px;font-weight:bold}
.choice.correct{background:var(--good);color:#fff;box-shadow:0 6px 0 #268A5D}
.choice.wrongpick{background:#FBE9EC;color:#C86A7C}
/* numpad */
.numwrap{display:flex;align-items:center;gap:30px}
.numdisp{width:190px;height:116px;border-radius:24px;background:#fff;box-shadow:var(--shadow);
 font-size:62px;font-weight:bold;display:flex;align-items:center;justify-content:center;color:var(--primary)}
.numpad{display:grid;grid-template-columns:repeat(5,92px);gap:11px}
.numpad button{height:78px;border-radius:20px;background:#fff;box-shadow:var(--shadow);
 font-size:40px;font-weight:bold}
.numpad .okk.ready{animation:okpulse .9s ease-in-out infinite}
@keyframes okpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.numpad .okk{background:var(--good);color:#fff;box-shadow:0 6px 0 #268A5D}
.micbtn{width:120px;height:120px;border-radius:50%;background:var(--primary);color:#fff;font-size:56px;
 box-shadow:0 8px 0 var(--primary-dk);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.micbtn.listening{background:#FF5A5A;box-shadow:0 8px 0 #C43D3D;animation:micpulse 1s ease-in-out infinite}
@keyframes micpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.micdisp{font-size:24px;font-weight:bold;color:var(--sub);max-width:220px;text-align:center;line-height:1.35}
.modetoggle{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:24px;flex:0 0 auto}
/* array figure (きょうりゅう) */
.array-area{position:absolute;right:16px;top:120px;width:460px;background:#FFFFFFF2;border-radius:26px;
 box-shadow:var(--shadow);padding:18px 16px;display:none;flex-direction:column;align-items:center;gap:10px;z-index:5}
.array-area.show{display:flex}
.array-rows{display:flex;flex-direction:column;gap:8px;justify-content:flex-start;padding-left:13px}
.array-row{display:flex;gap:8px;align-items:center;height:36px}
.setbox{position:relative;display:flex;gap:3px;align-items:center;height:34px;padding:4px 7px;
 border:2px dashed #D8DEEA;border-radius:12px;background:#FAFBFE;transition:border-color .25s,background .25s}
.array-row.lit .setbox{border-style:solid;border-color:var(--dan,#FF8A3D);background:color-mix(in srgb, var(--dan,#FF8A3D) 10%, #fff)}
.setbox .d{width:32px;height:24px;display:block;transition:transform .25s}
.setbox .d img{width:100%;height:100%;display:block;object-fit:contain;
 filter:grayscale(1) brightness(1.3) opacity(.5);transition:filter .3s}
.array-row.lit .setbox .d{transform:translateY(-2px)}
.array-row.lit .setbox .d img{filter:none}
.setnum{position:absolute;top:-11px;left:-11px;width:22px;height:22px;border-radius:50%;
 background:#C7D0E2;color:#fff;font-size:13px;font-weight:bold;display:flex;align-items:center;justify-content:center;
 transition:background .25s}
.array-row.lit .setnum{background:var(--dan,#FF8A3D)}
.array-row .cnt{font-size:22px;font-weight:bold;color:var(--sub);width:50px;text-align:right}
.array-row.lit .cnt{color:var(--dan,#FF8A3D)}
.array-title{font-size:22px;font-weight:bold;color:var(--sub)}
.arraybox{background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:20px 24px;transition:opacity .2s}
.array-area{transition:opacity .2s}
.arraybox.fadeout, .array-area.fadeout{opacity:0}
/* feedback */
.fbbubble{position:absolute;left:50%;top:120px;transform:translateX(-50%);background:#FFF;border-radius:24px;
 box-shadow:var(--shadow);padding:16px 30px;font-size:30px;font-weight:bold;display:none;z-index:8;max-width:700px;text-align:center}
.fbbubble.show{display:block;animation:pop .25s}
@keyframes pop{0%{transform:translateX(-50%) scale(.7)}100%{transform:translateX(-50%) scale(1)}}
.fireshow{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:9;display:none;
 pointer-events:none;align-items:flex-start}
.fireshow.show{display:flex}
.fireshow .fd{height:150px;animation:hm .35s ease-out}
.fireshow .fl{height:115px;margin:34px 0 0 -16px;transform-origin:left center;animation:blast .5s ease-out both}
@keyframes blast{0%{transform:scaleX(.12) scaleY(.5);opacity:0}30%{opacity:1}100%{transform:scaleX(1) scaleY(1);opacity:1}}
.walker{width:153px;height:116px;background-image:var(--walk);background-repeat:no-repeat;
 animation:walkcyc .62s steps(4) infinite}
@keyframes walkcyc{from{background-position:0 0}to{background-position:-612px 0}}
@keyframes hm{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.confetti{position:absolute;width:14px;height:14px;border-radius:4px;z-index:9;pointer-events:none;
 animation:fall 1.2s ease-in forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(360px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion: reduce){
 .confetti,.title-logo .dots span,.progress i.now,.formula .blank{animation:none}
}
/* --- 文字を減らすための視覚要素 --- */
.mon-row{display:flex;gap:18px;justify-content:center;margin-top:22px}
.mon-row svg{animation:bob 2s ease-in-out infinite}
.mon-row svg:nth-child(2){animation-delay:.3s}
.mon-row svg:nth-child(3){animation-delay:.6s}
.mon-row svg:nth-child(4){animation-delay:.9s}
.here{position:absolute;top:-14px;left:50%;transform:translateX(-50%);
 background:var(--primary);color:#fff;font-size:20px;font-weight:bold;padding:3px 16px;border-radius:14px;
 white-space:nowrap;box-shadow:0 3px 0 var(--primary-dk)}
.here::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
 border:7px solid transparent;border-top-color:var(--primary)}
@keyframes point{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-9px)}}
.mini{display:inline-flex;width:34px;height:40px;border-radius:9px;background:#fff;box-shadow:0 3px 0 rgba(58,66,86,.14);
 align-items:center;justify-content:center;font-size:24px;font-weight:bold;margin:0 3px}
.mini.tilt{transform:rotate(-9deg)}
.mini.tilt2{transform:rotate(11deg)}
.mini.bl{border:4px dashed var(--primary);color:var(--primary);background:#FFF7F0;width:40px}
.sicon{display:flex;align-items:center;height:46px}
.badge{position:absolute;top:-10px;right:-8px;font-size:28px}
.resdots{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:460px}
.resdots i{width:26px;height:26px;border-radius:50%;display:inline-block;background:var(--good)}
.resdots i.ng{background:#F5B8C4}
.icon-btn{width:66px;height:66px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:30px}
/* clear / result */
.clear-card{background:var(--panel);border-radius:32px;box-shadow:var(--shadow);width:760px;
 padding:30px 44px;display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:20px}
.stamp{font-size:26px;font-weight:bold;color:var(--good)}
.monster-get{animation:mget .8s ease-out}
@keyframes mget{0%{transform:scale(.2) rotate(-20deg);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1)}}
/* summary */
.sum-table{border-collapse:collapse;font-size:20px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.sum-table th,.sum-table td{padding:8px 14px;border-bottom:2px solid #EFF3F9;text-align:center}
.sum-table th{background:#F4F7FC}
.wrong-list{font-size:20px;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px 22px;max-height:170px;overflow-y:auto;min-width:300px}
.spk{background:#fff;border-radius:50%;width:66px;height:66px;box-shadow:var(--shadow);font-size:30px}
.row{display:flex;gap:16px;align-items:center}
.h2{font-size:34px;font-weight:bold}
.note{font-size:20px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<script>
'use strict';
/* =========================================================
   きゅうきゅうハンター — 小2向け 九九学習ソフト(単一HTML)
   企画・仕様・問題設計はユーザー承認済みドラフトに準拠
   ========================================================= */

/* ---------- 定数・データ ---------- */
const DAN_ORDER = [2,5,3,4,6,7,8,9,1];              // 攻略推奨順
const DAN_COLOR = {1:'#8E9BEF',2:'#4CAF6D',3:'#F06292',4:'#FF9440',5:'#42A5F5',6:'#26B8A5',7:'#9C6ADE',8:'#EF5350',9:'#F2B01E'};
const MONSTER = {
  2:{name:'スラりん',  type:'slime'},
  5:{name:'ほしポン',  type:'star'},
  3:{name:'うさぴょん',type:'bunny'},
  4:{name:'とりっぴ',  type:'bird'},
  6:{name:'きのこん',  type:'mushroom'},
  7:{name:'おばけっち',type:'ghost'},
  8:{name:'ドラたん',  type:'dragon'},
  9:{name:'ロボまる',  type:'robot'},
  1:{name:'おうかんぼう',type:'crown'}
};
const NUM_YOMI = {1:'いち',2:'に',3:'さん',4:'し',5:'ご',6:'ろく',7:'しち',8:'はち',9:'く'};
// 伝統的な九九の唱え(TTS用・分かち書き)
const KUKU_YOMI = {
 1:['いんいちが いち','いんにが に','いんさんが さん','いんしが し','いんごが ご','いんろくが ろく','いんしちが しち','いんはちが はち','いんくが く'],
 2:['にいちが に','ににんが し','にさんが ろく','にしが はち','にご じゅう','にろく じゅうに','にしち じゅうし','にはち じゅうろく','にく じゅうはち'],
 3:['さんいちが さん','さんにが ろく','さざんが く','さんし じゅうに','さんご じゅうご','さぶろく じゅうはち','さんしち にじゅういち','さんぱ にじゅうし','さんく にじゅうしち'],
 4:['しいちが し','しにが はち','しさん じゅうに','しし じゅうろく','しご にじゅう','しろく にじゅうし','ししち にじゅうはち','しは さんじゅうに','しく さんじゅうろく'],
 5:['ごいちが ご','ごに じゅう','ごさん じゅうご','ごし にじゅう','ごご にじゅうご','ごろく さんじゅう','ごしち さんじゅうご','ごは しじゅう','ごっく しじゅうご'],
 6:['ろくいちが ろく','ろくに じゅうに','ろくさん じゅうはち','ろくし にじゅうし','ろくご さんじゅう','ろくろく さんじゅうろく','ろくしち しじゅうに','ろくは しじゅうはち','ろっく ごじゅうし'],
 7:['しちいちが しち','しちに じゅうし','しちさん にじゅういち','しちし にじゅうはち','しちご さんじゅうご','しちろく しじゅうに','しちしち しじゅうく','しちは ごじゅうろく','しちく ろくじゅうさん'],
 8:['はちいちが はち','はちに じゅうろく','はちさん にじゅうし','はちし さんじゅうに','はちご しじゅう','はちろく しじゅうはち','はちしち ごじゅうろく','はっぱ ろくじゅうし','はっく しちじゅうに'],
 9:['くいちが く','くに じゅうはち','くさん にじゅうしち','くし さんじゅうろく','くご しじゅうご','くろく ごじゅうし','くしち ろくじゅうさん','くは しちじゅうに','くく はちじゅういち']
};
// 混同ペア(マスターモードで重点近接出題)
const CONFUSION = [[7,8],[6,8],[6,7],[4,7],[4,8],[3,7],[3,8],[6,9]];
const PRAISE = ['せいかい!','すごい!','やったね!','その ちょうし!','ばっちり!'];

/* ---------- 状態 ---------- */
const state = {
  progress: {},          // dan -> {intro:bool, steps:[bool,bool,bool]}
  masterCleared: false,
  records: { wrong:{}, hints:0, sessions:[] },   // wrong: "7×8" -> 回数
  sessionsSinceBreak: 0,
  soundOn: true
};
for (const d of DAN_ORDER) state.progress[d] = {intro:false, steps:[false,false,false]};
const allDanCleared = () => DAN_ORDER.every(d => state.progress[d].steps[2]);

/* ---------- ステージのスケーリング ---------- */
const stage = document.getElementById('stage');
function fit(){
  const s = Math.min(innerWidth/1040, innerHeight/660);
  stage.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ---------- 音声読み上げ (Web Speech API) ---------- */
let jaVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('ja'));
  jaVoice = vs.find(v=>/Kyoko|O-?ren|Google 日本語/i.test(v.name)) || vs[0] || null;
}
if ('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
let speakSeqId = 0;
let speakGen = 0;
function speak(text, {rate=0.95, pitch=1.08, onend}={}){
  const gen = ++speakGen;
  if (!('speechSynthesis' in window) || !state.soundOn){ if(onend) setTimeout(()=>{ if(gen===speakGen) onend(); },0); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='ja-JP'; if (jaVoice) u.voice = jaVoice;
  u.rate=rate; u.pitch=pitch;
  if(onend){ const fire=()=>{ if(gen===speakGen) onend(); }; u.onend=fire; u.onerror=fire; }
  speechSynthesis.speak(u);
}
// 順番に読み上げ(数え上げ用)。キャンセル安全。
function speakSeq(items, gapMs, onDone){
  const id = ++speakSeqId;
  let i = 0;
  const step = () => {
    if (id !== speakSeqId) return;
    if (i >= items.length){ onDone && onDone(); return; }
    const it = items[i++];
    if (it.fn) it.fn();
    if (it.text) speak(it.text, it.opt);
    setTimeout(step, it.gap != null ? it.gap : gapMs);
  };
  step();
}
function stopSpeak(){ speakSeqId++; if('speechSynthesis' in window) speechSynthesis.cancel(); }

/* ---------- 効果音 (Web Audio・プロシージャル) ---------- */
const AudioSys = (() => {
  let ctx=null, master, sfxBus;
  function ensure(){
    if (ctx){ if (ctx.state==='suspended') ctx.resume(); return ctx; }
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    master = ctx.createGain(); sfxBus = ctx.createGain();
    sfxBus.connect(master); master.connect(ctx.destination);
    return ctx;
  }
  document.addEventListener('pointerdown', ensure); // 解錠の保険
  function tone({freq=440, shape='sine', delay=0, dur=0.15, attack=0.008, volume=0.35}){
    if (!state.soundOn) return;
    const c = ensure(); const t0 = c.currentTime + 0.02 + delay;
    const o = c.createOscillator(); o.type=shape; o.frequency.value=freq;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(volume, t0+attack);
    g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    o.connect(g); g.connect(sfxBus); o.start(t0); o.stop(t0+dur+0.05);
  }
  return {
    ensure,
    tap(){ tone({freq:1600, shape:'sine', dur:0.05, attack:.002, volume:.14}); },
    correct(){ // 上行アルペジオ C5-E5-G5(明るい長和音)
      const v = 1 + (Math.random()*0.06-0.03);
      tone({freq:523*v, dur:.14, volume:.32});
      tone({freq:659*v, delay:.09, dur:.14, volume:.32});
      tone({freq:784*v, delay:.18, dur:.30, volume:.34});
    },
    wrong(){ // 小さな「ぽよ」(下行2音・柔らかく)
      tone({freq:330, shape:'triangle', dur:.13, attack:.012, volume:.16});
      tone({freq:294, shape:'triangle', delay:.11, dur:.16, attack:.012, volume:.14});
    },
    count(){ tone({freq:880, shape:'sine', dur:.08, attack:.004, volume:.18}); },
    fanfare(){ // 段クリアのジングル(Cメジャー)
      [[523,0],[659,.13],[784,.26],[1047,.42]].forEach(([f,d],i)=>
        tone({freq:f, delay:d, dur:i===3?.55:.15, shape:'sine', volume:.34}));
      tone({freq:1319, delay:.62, dur:.45, volume:.22});
    },
    sparkle(){ tone({freq:1568, dur:.1, volume:.2}); tone({freq:2093, delay:.08, dur:.2, volume:.18}); }
  };
})();

/* ---------- モンスターSVG ---------- */
function monsterSVG(dan, {size=100, silhouette=false}={}){
  const col = silhouette ? '#C6CFDF' : DAN_COLOR[dan];
  const face = silhouette ? '' : `
    <circle cx="41" cy="52" r="4.5" fill="#3A4256"/><circle cx="59" cy="52" r="4.5" fill="#3A4256"/>
    <circle cx="42.5" cy="50.5" r="1.5" fill="#fff"/><circle cx="60.5" cy="50.5" r="1.5" fill="#fff"/>
    <path d="M44 62 Q50 68 56 62" stroke="#3A4256" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="33" cy="59" r="4" fill="#FFB3C0" opacity=".7"/><circle cx="67" cy="59" r="4" fill="#FFB3C0" opacity=".7"/>`;
  const t = MONSTER[dan].type;
  let extra='';
  if (t==='slime')    extra=`<path d="M50 22 q4 -8 10 -6" stroke="${col}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  if (t==='star')     extra=`<path d="M50 8 l6 12 13 2 -9 9 2 13 -12 -6 -12 6 2 -13 -9 -9 13 -2 z" fill="${silhouette?col:'#FFD34D'}" stroke="#fff" stroke-width="2"/>`;
  if (t==='bunny')    extra=`<ellipse cx="38" cy="18" rx="8" ry="18" fill="${col}"/><ellipse cx="62" cy="18" rx="8" ry="18" fill="${col}"/><ellipse cx="38" cy="20" rx="4" ry="12" fill="#FFD9E2"/><ellipse cx="62" cy="20" rx="4" ry="12" fill="#FFD9E2"/>`;
  if (t==='bird')     extra=`<path d="M46 22 l8 -12 4 12 z" fill="${silhouette?col:'#FFD34D'}"/><path d="M20 55 q-12 0 -14 -10 q10 -2 16 4z" fill="${col}"/><path d="M80 55 q12 0 14 -10 q-10 -2 -16 4z" fill="${col}"/>`;
  if (t==='mushroom') extra=`<path d="M22 44 Q22 14 50 14 Q78 14 78 44 Z" fill="${silhouette?col:'#EF6D6D'}"/><circle cx="38" cy="30" r="5" fill="#fff" opacity=".9"/><circle cx="58" cy="24" r="4" fill="#fff" opacity=".9"/><circle cx="66" cy="36" r="4" fill="#fff" opacity=".9"/>`;
  if (t==='ghost')    extra=`<path d="M28 84 q4 8 8 0 q4 8 8 0 q4 8 8 0 q4 8 8 0 q4 8 8 0 L68 70 28 70z" fill="${col}"/>`;
  if (t==='dragon')   extra=`<path d="M34 20 l6 -12 6 10z M54 18 l6 -12 6 10z" fill="${silhouette?col:'#FFD34D'}"/><path d="M78 62 q14 -2 12 -14 q-10 2 -14 8z" fill="${col}"/>`;
  if (t==='robot')    extra=`<line x1="50" y1="18" x2="50" y2="6" stroke="${col}" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="5" r="5" fill="${silhouette?col:'#FFD34D'}"/><rect x="30" y="34" width="40" height="8" rx="4" fill="#fff" opacity=".5"/>`;
  if (t==='crown')    extra=`<path d="M32 22 l4 -14 8 9 6 -12 6 12 8 -9 4 14 z" fill="${silhouette?col:'#FFD34D'}" stroke="#fff" stroke-width="2"/>`;
  const body = (t==='ghost')
    ? `<path d="M28 70 L28 50 Q28 24 50 24 Q72 24 72 50 L72 70 Z" fill="${col}"/>`
    : `<ellipse cx="50" cy="58" rx="26" ry="${t==='slime'?22:26}" fill="${col}"/>`;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true">${extra}${body}${face}</svg>`;
}

/* ---------- 汎用 ---------- */
const el = (html) => { const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; };
function show(html){ stopSpeak(); stage.innerHTML=''; const s=el(`<div class="screen">${html}</div>`); stage.appendChild(s); return s; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
const rnd = a => a[Math.random()*a.length|0];
function tapSound(elm){ elm.addEventListener('pointerdown', ()=>AudioSys.tap()); }
function confettiBurst(container){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#FF8A3D','#34B37A','#42A5F5','#F2B01E','#F06292'];
  for(let i=0;i<24;i++){
    const c=el(`<span class="confetti" style="left:${360+Math.random()*240}px;top:${140+Math.random()*60}px;
      background:${rnd(cols)};animation-delay:${Math.random()*0.25}s"></span>`);
    container.appendChild(c); setTimeout(()=>c.remove(),1600);
  }
}

/* =========================================================
   画面② だんマップ
   ========================================================= */
function renderMap(){
  const nextDan = DAN_ORDER.find(d=>!state.progress[d].steps[2]);
  const cards = DAN_ORDER.map((d)=>{
    const p = state.progress[d];
    const clearedAll = p.steps[2];
    return `
    <button class="island ${d===nextDan?'next':''}" data-dan="${d}">
      ${d===nextDan?'<span class="here">ここ!</span>':''}
      ${clearedAll?'<span class="medal">🥇</span>':''}
      <span class="danface">${monsterSVG(d,{size:56,silhouette:!clearedAll})}</span>
      <span class="lbl" style="color:${DAN_COLOR[d]}"><b style="font-size:36px">${d}</b>のだん</span>
      <span class="stepdots">${p.steps.map(x=>`<i class="${x?'on':''}"></i>`).join('')}</span>
    </button>`;
  }).join('');
  const master = allDanCleared() ? `
    <button class="island master" id="master">
      <span style="font-size:44px">👑</span>
      <span class="lbl" style="font-size:30px">マスター</span>
      ${state.masterCleared?'<span style="font-size:32px">🥇</span>':''}
    </button>` : '';
  const s = show(`
    <div class="hud">
      <span class="name">きゅうきゅうハンター</span>
      <span class="row">
        <button class="icon-btn" id="rec">📖</button>
        <button class="icon-btn" id="snd">${state.soundOn?'🔊':'🔇'}</button>
      </span>
    </div>
    <div class="map-grid" style="margin-top:22px">${cards}${master}</div>
  `);
  s.querySelectorAll('.island[data-dan]').forEach(b=>{
    tapSound(b);
    b.onclick = ()=> renderDanPanel(+b.dataset.dan);
  });
  const rec=s.querySelector('#rec'); tapSound(rec); rec.onclick=()=>renderSummary('map');
  const snd=s.querySelector('#snd'); tapSound(snd);
  snd.onclick=()=>{ state.soundOn=!state.soundOn; if(!state.soundOn) stopSpeak(); renderMap(); };
  const m=s.querySelector('#master'); if(m){ tapSound(m); m.onclick=()=>startQuiz(0,2); }
}

/* =========================================================
   だんパネル(ステップえらび)
   ========================================================= */
const STEP_NAME = ['① じゅんばん','② シャッフル','③ むしくい'];
const STEP_SHORT = ['じゅんばん','バラバラ','むしくい'];
const STEP_ICON = [
  '<span class="mini">1</span><span class="mini">2</span><span class="mini">3</span>',
  '<span class="mini tilt">3</span><span class="mini tilt2">1</span><span class="mini">2</span>',
  '<span class="mini bl">?</span><span class="mini">×</span><span class="mini">4</span>'
];
function renderDanPanel(dan){
  const p = state.progress[dan];
  const steps = STEP_SHORT.map((nm,i)=>{
    const unlocked = i===0 ? p.intro : p.steps[i-1];
    const done = p.steps[i];
    return `<button class="stepbtn ${done?'done':''} ${unlocked?'':'locked'}" data-step="${i}" ${unlocked?'':'disabled'}>
      <span class="badge">${done?'⭐':unlocked?'':'🔒'}</span>
      <span class="sicon">${STEP_ICON[i]}</span><span class="t">${nm}</span>
    </button>`;
  }).join('');
  const s = show(`
    <div class="hud"><button class="icon-btn" id="back">←</button>
      <span class="name" style="color:${DAN_COLOR[dan]};font-size:34px">${dan}のだん</span>
      <span style="width:66px"></span></div>
    <div class="panel-card">
      <div class="row" style="gap:24px">
        <div>${monsterSVG(dan,{size:100,silhouette:!p.steps[2]})}</div>
        <button class="btn sub" id="intro" style="font-size:30px;min-height:76px">${p.intro?'🔁 おてほん':'▶ おてほん'}</button>
      </div>
      <div class="steprow">${steps}</div>
    </div>
  `);
  const back=s.querySelector('#back'); tapSound(back); back.onclick=renderMap;
  const ib=s.querySelector('#intro'); tapSound(ib); ib.onclick=()=>startIntro(dan);
  s.querySelectorAll('.stepbtn').forEach(b=>{ tapSound(b);
    b.onclick=()=>startQuiz(dan, +b.dataset.step);
  });
  if (!p.intro) speak('まずは おてほんを みてみよう!');
}

const FIRESHOW = `<div class="fireshow" id="hm"><img class="fd" src="${IMG_DINOFIRE}" alt=""><img class="fl" src="${IMG_FLAME}" alt=""></div>`;
const ROW_H = 36, ROW_GAP = 8;
// maxRows ぶんの高さを最初から確保するので、行が増えても図の位置がずれない
function arrayHTML(n, litRows=0, showCounts=true, maxRows=9){
  const h = maxRows*ROW_H + (maxRows-1)*ROW_GAP;
  let rows='';
  for(let r=1;r<=9;r++){
    rows+=`<div class="array-row ${r<=litRows?'lit':''}" data-r="${r}" style="${r<=litRows?'':'display:none'}">
      <div class="setbox"><span class="setnum">${r}</span>${`<span class="d"><img src="${IMG_STILL}" alt=""></span>`.repeat(n)}</div>
      ${showCounts?`<span class="cnt">${n*r}</span>`:''}
    </div>`;
  }
  return `<div class="array-rows" style="height:${h}px">${rows}</div>`;
}
function arraySetRows(area, n, count){
  area.querySelectorAll('.array-row').forEach(row=>{
    const r=+row.dataset.r;
    row.style.display = r<=count ? 'flex' : 'none';
  });
}
function arrayLight(area, upto){
  area.querySelectorAll('.array-row').forEach(row=>{
    row.classList.toggle('lit', +row.dataset.r <= upto);
  });
}

function startIntro(dan){
  const s = show(`
    <div class="hud"><button class="icon-btn" id="back">←</button>
      <span class="name" style="color:${DAN_COLOR[dan]};font-size:32px">おてほん</span>
      <button class="icon-btn" id="skip">▶▶</button></div>
    <p id="msg" class="h2" style="min-height:44px">${dan}ひき ずつ ふえるよ</p>
    <div class="row" style="margin-top:10px;align-items:flex-start;gap:44px">
      <div class="arraybox" style="--dan:${DAN_COLOR[dan]}">
        ${arrayHTML(dan,0,true,9)}
      </div>
      <div style="text-align:center;width:250px;padding-top:30px">
        <div id="shiki" class="formula" style="font-size:56px;margin-top:0;justify-content:center">${dan} × <span id="mm" class="q">1</span></div>
        <div id="tot" style="font-size:96px;font-weight:bold;color:${DAN_COLOR[dan]};margin-top:22px">${dan}</div>
      </div>
    </div>
  `);
  const back=s.querySelector('#back'); tapSound(back);
  back.onclick=()=>{ stopSpeak(); renderDanPanel(dan); };
  const area=s.querySelector('.array-rows');
  const mm=s.querySelector('#mm'), tot=s.querySelector('#tot');
  // デモ: 1つぶん→9つぶん(最初の3つは唱え付き、以降テンポ良く)
  const items=[];
  items.push({text:`1つぶんは ${dan}ひき。${dan}ひき ずつ ふえていくよ`, gap:2400, fn:()=>{arraySetRows(area,dan,1);arrayLight(area,1);}});
  for(let m=1;m<=9;m++){
    const slow = m<=3;
    items.push({
      text: slow ? KUKU_YOMI[dan][m-1] : String(dan*m),
      gap: slow?1900:950,
      fn: ()=>{ arraySetRows(area,dan,m); arrayLight(area,m); mm.textContent=m; tot.textContent=dan*m; AudioSys.count(); }
    });
  }
  items.push({text:'こんどは きみの ばん!', gap:1400});
  const toPractice=()=>introPractice(dan,0);
  speakSeq(items, 1000, toPractice);
  const skip=s.querySelector('#skip'); tapSound(skip);
  skip.onclick=()=>{ stopSpeak(); toPractice(); };
}
// 操作パート: 「もう1つぶん」ボタンで行を足し、いくつ?に数字パッドで答える(n×2, n×3, n×5)
function introPractice(dan, idx){
  const MS=[2,3,5]; const m=MS[idx];
  const s = show(`
    <div class="hud"><button class="icon-btn" id="back">←</button>
      <span class="name" style="color:${DAN_COLOR[dan]};font-size:32px">やってみよう ${'①②③'[idx]}</span>
      <button class="spk" id="spk">🔊</button></div>
    <p id="msg" class="h2">${m}つぶん おいてね 👇</p>
    <div class="row" style="align-items:flex-start;gap:40px;margin-top:2px">
      <div class="arraybox" style="--dan:${DAN_COLOR[dan]}">
        ${arrayHTML(dan,0,true,5)}
      </div>
      <div style="text-align:center;width:230px;padding-top:16px">
        <div class="formula" style="font-size:56px;margin-top:0;justify-content:center">${dan} × <span class="q" id="mm">0</span></div>
      </div>
    </div>
    ${FIRESHOW}
    <div id="slot" style="height:262px;display:flex;align-items:center;justify-content:center;margin-top:2px">
      <button class="btn green" id="add" style="font-size:34px;min-height:96px;padding:22px 56px">➕ 1つぶん</button>
      <div class="numwrap" id="pad" style="display:none"></div>
    </div>
  `);
  const back=s.querySelector('#back'); tapSound(back); back.onclick=()=>renderDanPanel(dan);
  const area=s.querySelector('.array-rows'); const mm=s.querySelector('#mm'); const msg=s.querySelector('#msg');
  const say=()=>speak(`もう1つぶんを おして、${dan}を ${NUM_YOMI[m]}つぶん おいてみよう`);
  say(); const spk=s.querySelector('#spk'); tapSound(spk); spk.onclick=say;
  let cur=0;
  const add=s.querySelector('#add'); tapSound(add);
  add.onclick=()=>{
    cur=Math.min(9,cur+1); arraySetRows(area,dan,cur); arrayLight(area,cur);
    mm.textContent=cur; AudioSys.count();
    if(cur===m){
      add.style.display='none';
      msg.innerHTML=`ぜんぶで いくつ?`;
      let micHandle2 = null;
      speak(`${NUM_YOMI[dan]} が ${NUM_YOMI[m]}つぶん。ぜんぶで いくつ?`,
        { onend: ()=> micHandle2 && micHandle2.autoStart() });
      micHandle2 = mountNumpad(s.querySelector('#pad'), dan*m, {
        onCorrect:()=>{
          AudioSys.correct(); s.querySelector('#hm').classList.add('show');
          s.querySelector('.arraybox')?.classList.add('fadeout');
          confettiBurst(s);
          speak(rnd(PRAISE)+'  '+KUKU_YOMI[dan][m-1]);
          setTimeout(()=> idx<2 ? introPractice(dan,idx+1) : introDone(dan), 1600);
        },
        onWrong:(attempt)=>{
          AudioSys.wrong();
          if(attempt===1){
            speak('おしい! 1ぎょうずつ かぞえてみよう', { onend: ()=> micHandle2 && micHandle2.autoStart() });
            flashCount(area,dan,m);
          }
          else { flashCount(area,dan,m,true,()=>{
            speak(`こたえは ${dan*m}。もういちど いれてみてね`, { onend: ()=> micHandle2 && micHandle2.autoStart() });
          }); }
        }
      });
      s.querySelector('#pad').style.display='flex';
    } else if(cur>m){
      speak(`${NUM_YOMI[m]}つぶんに してみよう`); cur=m; arraySetRows(area,dan,cur); arrayLight(area,cur); mm.textContent=cur;
    }
  };
}
function flashCount(area, dan, m, withVoice=false, onDone){
  const items=[];
  for(let r=1;r<=m;r++) items.push({ text: withVoice?String(dan*r):null, gap:withVoice?900:350,
    fn:()=>{ arrayLight(area,r); AudioSys.count(); } });
  speakSeq(items, 400, onDone);
}
function introDone(dan){
  state.progress[dan].intro = true;
  const s = show(`
    <div class="clear-card" style="margin-top:120px">
      <div style="font-size:64px">🎉</div>
      <p class="h2">おてほん クリア!</p>
      <div class="row">
        <button class="btn" id="go" style="font-size:34px">▶ じゅんばん</button>
        <button class="btn sub" id="map">マップ</button>
      </div>
    </div>`);
  AudioSys.sparkle(); speak('おてほん クリア! つぎは じゅんばんに ちょうせんしよう!');
  const g=s.querySelector('#go'); tapSound(g); g.onclick=()=>startQuiz(dan,0);
  const mp=s.querySelector('#map'); tapSound(mp); mp.onclick=renderMap;
}

/* =========================================================
   出題エンジン
   ========================================================= */
// 問題: {n, m, ans, kind:'mul'|'blankB'|'blankA', input:'choice'|'pad', retry:bool}
function makeQ(n,m,kind,input){ return {n,m,ans:kind==='blankB'?m:(kind==='blankA'?n:n*m),kind,input,attempts:0,hinted:false}; }
function noAdjacentShuffle(ms){
  for(let t=0;t<30;t++){ shuffle(ms); let ok=true;
    for(let i=1;i<ms.length;i++) if(ms[i]===ms[i-1]) ok=false;
    if(ok) break; }
  return ms;
}
function buildQuestions(dan, step){
  if (dan===0) return buildMaster();
  const qs=[];
  if (step===0){ // じゅんばん: n×1..9 + 復習1問
    for(let m=1;m<=9;m++) qs.push(makeQ(dan,m,'mul','pad'));
    qs.push(makeQ(dan, rnd([6,7,8,9]), 'mul','pad'));
  } else if (step===1){ // シャッフル
    const ms=noAdjacentShuffle([1,2,3,4,5,6,7,8,9]);
    ms.forEach(m=>qs.push(makeQ(dan,m,'mul','pad')));
    let extra=rnd([4,6,7,8]); if(extra===ms[8]) extra=extra===8?7:8;
    qs.push(makeQ(dan,extra,'mul','pad'));
  } else { // むしくい6 + ランダム4
    const ms=shuffle([2,3,4,5,6,7,8,9]).slice(0,6);
    const blanks = ms.map((m,i)=> i<3 ? makeQ(dan,m,'blankB','pad') : makeQ(dan,m,'blankA','pad'));
    const rands = shuffle([1,2,3,4,5,6,7,8,9]).slice(0,4).map(m=>makeQ(dan,m,'mul','pad'));
    // 前半にblankB(選択)、後半にblankA(パッド)が来るよう軽く並べる
    qs.push(blanks[0], rands[0], blanks[1], rands[1], blanks[2], blanks[3], rands[2], blanks[4], rands[3], blanks[5]);
  }
  return qs;
}
function buildMaster(){
  const qs=[]; const used=new Set();
  const wrongTop = Object.entries(state.records.wrong).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([k])=>k.split('×').map(Number));
  const pairs = shuffle(CONFUSION.slice()).slice(0,3);
  const pool=[];
  wrongTop.forEach(([n,m])=>pool.push([n,m]));
  pairs.forEach(([n,m])=>{ pool.push([n,m]); pool.push([m,n]); });
  while(pool.length<6){ const n=1+Math.random()*9|0, m=1+Math.random()*9|0;
    if(!pool.some(([a,b])=>a===n&&b===m)) pool.push([n,m]); }
  shuffle(pool).slice(0,6).forEach(([n,m])=>{ used.add(n+'×'+m); qs.push(makeQ(n,m,'mul','pad')); });
  let c=0;
  while(c<4){ const n=2+Math.random()*8|0, m=2+Math.random()*8|0;
    if(used.has(n+'×'+m)) continue; used.add(n+'×'+m);
    qs.push(c%2===0?makeQ(n,m,'blankB','pad'):makeQ(n,m,'blankA','pad')); c++; }
  return shuffle(qs);
}
// 3択の誤答肢: ①隣の段 (n±1)×m ②±1つ分 n×(m±1)
function makeChoices(q){
  const set=new Set([q.ans]); const out=[q.ans];
  const cand=[];
  if(q.kind==='mul'){
    if(q.n>1)cand.push((q.n-1)*q.m); if(q.n<9)cand.push((q.n+1)*q.m);
    if(q.m>1)cand.push(q.n*(q.m-1)); if(q.m<9)cand.push(q.n*(q.m+1));
    cand.push(q.ans+q.n, q.ans-q.n);
  } else { // blankB: 答えは m(いくつぶん)
    if(q.m>1)cand.push(q.m-1); if(q.m<9)cand.push(q.m+1);
    if(q.m>2)cand.push(q.m-2); if(q.m<8)cand.push(q.m+2);
    cand.push(q.n); // 「かけるかず」との混同肢
  }
  const max = q.kind==='blankB' ? 9 : 81;
  shuffle(cand);
  for(const c of cand){ if(out.length>=3)break;
    if(c>=1&&c<=max&&!set.has(c)){set.add(c);out.push(c);} }
  let f=1;
  while(out.length<3 && f<=max){
    for(const c of [q.ans-f, q.ans+f]){
      if(out.length<3 && c>=1 && c<=max && !set.has(c)){set.add(c);out.push(c);}
    }
    f++;
  }
  return shuffle(out);
}
// 誤答の種類判定 → ヒント1の文言
function classifyWrong(q, val){
  if(q.kind==='mul'){
    if(val===(q.n-1)*q.m || val===(q.n+1)*q.m)
      return {type:'混同', hint:`${q.n}のだん だよ!`,
              voice:`${NUM_YOMI[q.n]}のだん だよ。${NUM_YOMI[q.n]}のだんを じゅんばんに いってみよう`};
    if(val===q.n*(q.m-1) || val===q.n*(q.m+1))
      return {type:'±1つ分', hint:`いくつぶん?`,
              voice:`${NUM_YOMI[q.n]}が ${NUM_YOMI[q.m]}つぶん だよ。いくつぶんか もういちど みてみよう`};
    return {type:'その他', hint:'👀 ヒントを みてね', voice:'アレイずで かんがえてみよう'};
  }
  if(val===q.n*q.m)
    return {type:'読み違い', hint:'□の かず だよ',  voice:'しかくに はいる かずを こたえてね'};
  return {type:'その他', hint:'👀 ヒントを みてね', voice:`アレイずで かんがえてみよう`};
}
const qKey = q => `${q.n}×${q.m}`;
function questionVoice(q){
  if(q.kind==='mul')   return `${NUM_YOMI[q.n]} かける ${NUM_YOMI[q.m]} は?`;
  if(q.kind==='blankB')return `${NUM_YOMI[q.n]} かける なにで ${q.n*q.m} に なる?`;
  return `なに かける ${NUM_YOMI[q.m]} で ${q.n*q.m} に なる?`;
}
function formulaHTML(q, blankVal){
  const bx = v => v!=null ? `<span class="blank" style="animation:none;border-style:solid">${v}</span>` : `<span class="blank">?</span>`;
  if(q.kind==='mul')    return `${q.n} × ${q.m} = <span class="q">?</span>`;
  if(q.kind==='blankB') return `${q.n} × ${bx(blankVal)} = ${q.n*q.m}`;
  return `${bx(blankVal)} × ${q.m} = ${q.n*q.m}`;
}

// 話した内容から数字を読み取る(算用数字/漢数字。認識精度を優先しシンプルに)
function parseSpokenNumber(text){
  if (text==null) return null;
  const t = String(text).trim();
  const m = t.match(/\d+/);
  if (m){ const v=parseInt(m[0],10); if(v>=0 && v<=999) return v; }
  const km = t.match(/[〇零一二三四五六七八九十百]+/);
  if (km){
    const KJ={'〇':0,'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
    let section=0, num=null;
    for(const ch of km[0]){
      if(ch==='十') section += (num??1)*10;
      else if(ch==='百') section += (num??1)*100;
      else num = KJ[ch];
    }
    return section + (num??0);
  }
  return null;
}
let micGen = 0;
function mountNumpad(host, answer, {onCorrect,onWrong,onInput}){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micOK = !!SR;
  let mode = micOK ? 'mic' : 'keypad';
  let attempts = 0, rec = null, busy = false;
  const myGen = ++micGen;
  const stale = ()=> myGen!==micGen || !host.isConnected;

  function submit(v){
    if (+v===answer){ onCorrect(attempts); return; }
    attempts++; onWrong(attempts, +v);
  }
  function render(){
    if (mode==='mic'){
      host.innerHTML = `<div class="numwrap">
        <button class="micbtn" id="micbtn">🎤</button>
        <div class="micdisp" id="micdisp">🎤 はなして<br>こたえてね</div>
        <button class="modetoggle" id="toggleMode">⌨</button>
      </div>`;
      const mb=host.querySelector('#micbtn'); tapSound(mb); mb.onclick=startListening;
    } else {
      host.innerHTML = `<div class="numwrap">
        <div class="numdisp" id="nd">&nbsp;</div>
        <div class="numpad">
          ${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
          <button data-k="del" style="grid-column:span 2">⌫</button>
          <button class="okk" data-k="ok" style="grid-column:span 3">OK</button>
        </div>
        ${micOK?'<button class="modetoggle" id="toggleMode">🎤</button>':''}
      </div>`;
      let val='';
      const nd=host.querySelector('#nd'); const okBtn=host.querySelector('[data-k="ok"]');
      host.querySelectorAll('.numpad button').forEach(b=>{ tapSound(b);
        b.onclick=()=>{
          const k=b.dataset.k;
          if(k==='del'){ val=val.slice(0,-1); }
          else if(k==='ok'){ if(!val) return; submit(+val); val=''; }
          else if(val.length<2){ val+=k; onInput&&onInput(); }
          nd.innerHTML = val || '&nbsp;';
          okBtn.classList.toggle('ready', val.length>0);
        };
      });
    }
    const tg=host.querySelector('#toggleMode');
    if (tg) tg.onclick=()=>{ stopRec(); mode = mode==='mic' ? 'keypad':'mic'; render(); if(mode==='mic') startListening(); };
  }
  function startListening(){
    if (stale() || busy || mode!=='mic') return;
    busy=true;
    const disp=host.querySelector('#micdisp'); const mb=host.querySelector('#micbtn');
    if(!disp||!mb){ busy=false; return; }
    mb.classList.add('listening'); disp.innerHTML='きいて<br>いるよ…';
    AudioSys.ensure();
    try{
      rec = new SR(); rec.lang='ja-JP'; rec.interimResults=false; rec.maxAlternatives=5;
      rec.onresult = (e)=>{
        busy=false; if(stale()) return;
        let val=null;
        for(let i=0;i<e.results[0].length;i++){
          const n=parseSpokenNumber(e.results[0][i].transcript);
          if(n!=null){ val=n; break; }
        }
        mb.classList.remove('listening');
        if(val==null){
          disp.innerHTML='きこえなかったよ<br>もう一回 はなしてね';
          setTimeout(()=>{ if(!stale()) startListening(); }, 1300);
        } else {
          disp.innerHTML=`<span style="font-size:34px;color:var(--primary)">${val}</span><br>ときこえたよ`;
          setTimeout(()=>{ if(!stale()) submit(val); }, 550);
        }
      };
      rec.onerror = (e)=>{
        busy=false; if(stale()) return;
        mb.classList.remove('listening');
        if(e.error==='not-allowed' || e.error==='service-not-allowed' || e.error==='audio-capture'){
          disp.innerHTML='マイクが つかえないよ'; mode='keypad'; setTimeout(()=>{ if(!stale()) render(); },700);
        } else if(e.error==='no-speech'){
          disp.innerHTML='きこえなかったよ<br>もう一回 はなしてね';
          setTimeout(()=>{ if(!stale()) startListening(); }, 1300);
        } else {
          setTimeout(()=>{ if(!stale()) startListening(); }, 1300);
        }
      };
      rec.onend = ()=>{ busy=false; if(!stale()) mb.classList.remove('listening'); };
      rec.start();
    }catch(err){
      busy=false; if(stale()) return;
      mb.classList.remove('listening');
      disp.innerHTML='マイクが つかえないよ'; mode='keypad'; setTimeout(()=>{ if(!stale()) render(); },700);
    }
  }
  function stopRec(){ if(rec){ try{rec.stop();}catch(e){} rec=null; } busy=false; }
  render();
  // 質問・ヒントの読み上げが終わったら呼び出し側から起動してもらう(自動で聞き始める)
  return { autoStart(){ if(!stale() && mode==='mic') startListening(); } };
}

let session = null;
function startQuiz(dan, step){
  session = {
    dan, step,
    queue: buildQuestions(dan, step),
    idx: 0,
    results: [],          // {key, firstTry:bool}
    wrongs: {},           // key -> 回数(このセッション)
    hintsUsed: 0,
    inserted: 0
  };
  renderQuestion();
}
function sessionTitle(){
  if(session.dan===0) return '👑 マスター';
  return `${session.dan}のだん ${'①②③'[session.step]}`;
}
function renderQuestion(){
  const q = session.queue[session.idx];
  if(!q){ finishSession(); return; }
  q.attempts=0; q.hinted=false;
  const total = session.queue.length;
  const dots = session.queue.map((qq,i)=>{
    if(i<session.idx) return `<i class="${session.results[i]&&session.results[i].firstTry?'ok':'ng'}"></i>`;
    if(i===session.idx) return '<i class="now"></i>';
    return '<i></i>';
  }).join('');
  const danCol = DAN_COLOR[session.dan] || '#F2B01E';
  const s = show(`
    <div class="quiz-top">
      <button class="icon-btn" id="quit">←</button>
      <span class="name" style="font-size:26px;color:${danCol}">${sessionTitle()}</span>
      <span class="row">
        <button class="small-btn" id="arr" style="font-size:24px">👀 ヒント</button>
        <button class="spk" id="spk">🔊</button>
      </span>
    </div>
    <div class="progress">${dots}</div>
    <div class="formula" id="fx">${formulaHTML(q)}</div>
    <div id="ansarea" style="height:284px;display:flex;flex-direction:column;align-items:center;justify-content:center"></div>
    <div class="array-area" id="arrbox" style="--dan:${danCol}">
      <span class="array-title">${q.n}ひき ずつ</span>
      ${arrayHTML(q.n,0,true,Math.max(q.m,2))}
    </div>
    <div class="fbbubble" id="fb"></div>
    ${FIRESHOW}
  `);
  const quit=s.querySelector('#quit'); tapSound(quit);
  quit.onclick=()=>{ stopSpeak(); session.dan===0?renderMap():renderDanPanel(session.dan); };
  const arrbox=s.querySelector('#arrbox'); const area=arrbox.querySelector('.array-rows');
  arraySetRows(area,q.n,q.kind==='blankA'?0:q.m); arrayLight(area,0);
  const arrBtn=s.querySelector('#arr'); tapSound(arrBtn);
  arrBtn.onclick=()=>arrbox.classList.toggle('show');
  let micHandle = null;
  const say=()=>speak(questionVoice(q), { onend: ()=> micHandle && micHandle.autoStart() });
  const spk=s.querySelector('#spk'); tapSound(spk); spk.onclick=say;
  say();

  const fb=s.querySelector('#fb'); const hm=s.querySelector('#hm');
  const showFb=(txt)=>{ fb.textContent=txt; fb.classList.add('show'); };
  const hideFb=()=>fb.classList.remove('show');
  const lockAnswers=()=>s.querySelectorAll('#ansarea button').forEach(b=>b.disabled=true);

  const onCorrect = (firstTry)=>{
    hideFb(); lockAnswers(); AudioSys.correct();
    arrbox.classList.add('fadeout');
    hm.classList.add('show'); confettiBurst(s);
    const praise = rnd(PRAISE);
    const yomi = KUKU_YOMI[q.n][q.m-1];
    speak(`${praise} ${yomi}`);
    session.results.push({key:qKey(q), firstTry});
    setTimeout(()=>{ session.idx++; renderQuestion(); }, 1500);
  };
  const recordWrong = ()=>{
    const k=qKey(q);
    session.wrongs[k]=(session.wrongs[k]||0)+1;
    state.records.wrong[k]=(state.records.wrong[k]||0)+1;
  };
  const onWrong = (attempt, val)=>{
    AudioSys.wrong(); recordWrong();
    const cls = classifyWrong(q, val);
    if(attempt===1){
      q.hinted=true; session.hintsUsed++; state.records.hints++;
      showFb('おしい! ' + cls.hint);
      speak('おしい。' + cls.voice, { onend: ()=> micHandle && micHandle.autoStart() });
      if(cls.type==='±1つ分'){ arrbox.classList.add('show'); arrayLight(area, 0); }
    } else {
      // 2回誤答 → アレイずで一緒に数える解説 → 類題を挿入
      lockAnswers();
      showFb('いっしょに かぞえよう!');
      explainByCounting(s, q, area, arrbox, ()=>{
        session.results.push({key:qKey(q), firstTry:false});
        insertRuidai(q); requeue(q);
        session.idx++; renderQuestion();
      });
    }
  };

  const host=s.querySelector('#ansarea');
  if(q.input==='choice'){
    const cs = makeChoices(q);
    host.innerHTML = `<div class="answers">${cs.map(c=>`<button class="choice" data-v="${c}">${c}</button>`).join('')}</div>`;
    host.querySelectorAll('.choice').forEach(b=>{ tapSound(b);
      b.onclick=()=>{
        const v=+b.dataset.v;
        if(v===q.ans){ b.classList.add('correct'); onCorrect(q.attempts===0 && !q.hinted); }
        else{ q.attempts++; b.classList.add('wrongpick'); b.disabled=true; onWrong(q.attempts, v); }
      };
    });
  } else {
    host.innerHTML = `<div class="numwrap" id="pad"></div>`;
    micHandle = mountNumpad(host.querySelector('#pad'), q.ans, {
      onCorrect:(att)=>onCorrect(att===0 && !q.hinted),
      onWrong:(att,val)=>{ q.attempts=att; onWrong(att,val); },
      onInput:hideFb
    });
  }
}
// 2回誤答後の解説: 行を1行ずつ光らせて累積を読み上げ、答えまで一緒に
function explainByCounting(s, q, area, arrbox, onDone){
  arrbox.classList.add('show');
  arraySetRows(area, q.n, q.m); arrayLight(area, 0);
  const items=[{text:`${NUM_YOMI[q.n]}ひき ずつ、${NUM_YOMI[q.m]}れつ。いっしょに かぞえよう`, gap:2200}];
  for(let r=1;r<=q.m;r++){
    items.push({ text:String(q.n*r), gap:1050,
      fn:()=>{ arrayLight(area,r); AudioSys.count(); } });
  }
  items.push({ gap:400, fn:()=>{
    const fx=s.querySelector('#fx');
    if(q.kind==='mul') fx.innerHTML=`${q.n} × ${q.m} = <span class="q">${q.n*q.m}</span>`;
    else fx.innerHTML=formulaHTML(q, q.ans);
  }});
  items.push({ text:`${KUKU_YOMI[q.n][q.m-1]}。つぎは きっと できるよ!`, gap:2400 });
  speakSeq(items, 1000, ()=>{
    const fb=s.querySelector('#fb');
    fb.innerHTML=''; fb.classList.add('show');
    const nb=el('<button class="btn green" style="font-size:26px;min-height:64px;padding:12px 40px">つぎへ ▶</button>');
    fb.appendChild(nb); tapSound(nb);
    nb.onclick=()=>{ stopSpeak(); onDone(); };
  });
}
// 類題(同じ段の m±1)を直後に挿入 —「できた」で締める
function insertRuidai(q){
  if(session.inserted>=4) return;
  let m2 = q.m>1 ? q.m-1 : q.m+1;
  if(q.kind!=='mul') m2 = Math.max(1,Math.min(9,m2));
  session.queue.splice(session.idx+1, 0, makeQ(q.n, m2, 'mul', 'pad'));
  session.inserted++;
}
// まちがえた問題を2〜3問あとに再出題(セッション内間隔反復)
function requeue(q){
  if(session.inserted>=4) return;
  const pos = session.idx + 2 + (Math.random()<0.5?1:2); // 現在+3〜4 ≒ 類題を挟んで2〜3問後
  const copy = makeQ(q.n,q.m,q.kind,q.input);
  session.queue.splice(Math.min(pos, session.queue.length), 0, copy);
  session.inserted++;
}

/* =========================================================
   画面⑤ クリア/けっか
   ========================================================= */
function finishSession(){
  const res = session.results;
  const last5 = res.slice(-5);
  const cleared = res.length>=5 && last5.every(r=>r.firstTry);
  const firstCnt = res.filter(r=>r.firstTry).length;
  // 記録
  state.records.sessions.push({
    label: sessionTitle(), total: res.length, first: firstCnt,
    wrongs: Object.entries(session.wrongs)
  });
  let gotMonster=false, danDone=false;
  if(cleared){
    if(session.dan===0){ state.masterCleared=true; danDone=true; }
    else {
      const p=state.progress[session.dan];
      if(!p.steps[session.step]){
        p.steps[session.step]=true;
        if(session.step===2){ gotMonster=true; }
      }
      danDone = session.step===2;
    }
  }
  state.sessionsSinceBreak++;
  const needBreak = state.sessionsSinceBreak>=2;

  const dan=session.dan;
  const monsterPart = gotMonster ? `
    <div class="monster-get">${monsterSVG(dan,{size:130})}</div>
    <p class="h2" style="color:${DAN_COLOR[dan]}">${MONSTER[dan].name} ゲット!</p>`
    : (cleared&&dan===0?`<div style="font-size:90px">👑</div><p class="h2">九九マスター!</p>`:'');
  const stampRow = `<div style="font-size:60px">${cleared?'🌸⭐🌸':'💪'}</div>`;
  const s = show(`
    <div class="clear-card">
      ${stampRow}
      <p class="h2">${cleared?'クリア!':'あと すこし!'}</p>
      ${monsterPart}
      <div class="resdots">${res.map(r=>`<i class="${r.firstTry?'':'ng'}"></i>`).join('')}</div>
      <div class="row" style="margin-top:6px">
        <button class="btn ${cleared?'sub':''}" id="again">🔁 もういちど</button>
        <button class="btn ${cleared?'':'sub'}" id="map">マップ</button>
        <button class="icon-btn" id="sum">📖</button>
      </div>
    </div>
  `);
  if(cleared){ AudioSys.fanfare(); confettiBurst(s);
    speak(gotMonster?`クリア! ${MONSTER[dan].name}が なかまに なったよ!`:'クリア! よくがんばったね!');
  } else { AudioSys.sparkle();
    speak('あとすこし! さいごの ごもんを つづけて せいかいすると クリアだよ。もういちど やってみよう!'); }
  const ag=s.querySelector('#again'); tapSound(ag);
  ag.onclick=()=> needBreak ? renderBreak(()=>startQuiz(session.dan, session.step)) : startQuiz(session.dan, session.step);
  const mp=s.querySelector('#map'); tapSound(mp);
  mp.onclick=()=> needBreak ? renderBreak(renderMap) : renderMap();
  const sm=s.querySelector('#sum'); tapSound(sm); sm.onclick=()=>renderSummary('clear');
}

  const wrongHTML = wrongs.length
    ? wrongs.map(([k,c])=>`<div>${k} … ${c}回</div>`).join('')
    : '<div>まだ まちがいの きろくは ありません</div>';
  const s = show(`
    <div class="hud"><button class="small-btn" id="back">← もどる</button>
      <span class="name">おうちのひとへ(きろく)</span><span style="width:110px"></span></div>
    <div class="row" style="align-items:flex-start;gap:26px">
      <table class="sum-table">
        <tr><th>順</th><th>だん</th><th>導入</th><th>①順番</th><th>②シャッフル</th><th>③虫食い</th></tr>
        ${rows}
        <tr><td colspan="2">マスターモード</td><td colspan="4">${state.masterCleared?'✅ クリア':'—'}</td></tr>
      </table>
      <div>
        <p style="font-size:20px;font-weight:bold;margin-bottom:6px">つまずいた九九(累計)</p>
        <div class="wrong-list">${wrongHTML}</div>
        <p class="note" style="margin-top:10px;text-align:left;font-size:17px">
          セッション数: ${state.records.sessions.length} / ヒント使用: ${state.records.hints}回<br>
          ※この記録は画面を閉じると消えます(端末には保存されません)</p>
      </div>
    </div>
  `);
  const back=s.querySelector('#back'); tapSound(back);
  back.onclick=()=> from==='map' ? renderMap() : renderMap();
}

/* ---------- 起動 ---------- */
renderTitle();
</script>
</body>
</html>
